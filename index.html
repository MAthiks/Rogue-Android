function populateBestiary(all,biome,floor,seed){
 if(floor<4||!Object.hasOwn(BESTIARY,biome))return all;
 let state=(seed^Math.imul(floor,0x51ed270b)^0xe245b891)>>>0;
 const rnd=n=>{state=(Math.imul(state,1664525)+1013904223)>>>0;return Math.floor(state/4294967296*n)};
 const depth=Math.max(1,Math.min(30,floor)),bonus=Math.floor((depth-1)/6);
 return all.map(m=>{
   if(m.boss||m.elite||m.rare||rnd(100)>=55)return m;
   const [species,kind,color,role,skill]=BESTIARY[biome][rnd(2)];
   const hp=5+Math.floor(depth/2)+bonus+(role==='brute'?4:role==='tracker'?1:0);
   return {...m,species,kind,color,role,creatureSkill:skill,creatureCD:0,hp,maxHp:hp,atk:2+bonus+(role==='brute'?1:0)};
 });
}
function creatureAction(m,player,all,board){
 if(!m.species||m.boss||!Object.hasOwn(CREATURE_POWERS,m.creatureSkill))return null;
 const skill=CREATURE_POWERS[m.creatureSkill],distance=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y)),same=(a,b)=>a.x===b.x&&a.y===b.y;
 const ray=(a,b)=>{const n=distance(a,b);let prev=a;for(let i=1;i<=n;i++){const p={x:Math.round(a.x+(b.x-a.x)*i/n),y:Math.round(a.y+(b.y-a.y)*i/n)};if(!board.stepOK(p.x,p.y,prev.x,prev.y)||(i<n&&all.some(z=>z!==m&&z.hp>0&&same(z,p))))return false;prev=p}return true};
 if(m.intent){const intent=m.intent;delete m.intent;m.creatureCD=skill.cd;return {type:'release',hit:distance(m,player)<=skill.range+Number(m.creatureSkill==='burst')&&intent.cells.some(p=>same(p,player))&&ray(m,player),power:skill.power,ranged:skill.ranged,drain:m.creatureSkill==='drain',name:skill.name}}
 if(m.creatureCD>0){m.creatureCD--;return null}
 if(distance(m,player)>skill.range||!ray(m,player))return null;
 const cells=[{x:player.x,y:player.y}];
 if(m.creatureSkill==='burst')for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const p={x:player.x+dx,y:player.y+dy};
   if(!same(m,p)&&board.stepOK(p.x,p.y,player.x,player.y)&&ray(m,p))cells.push(p);
 }
 if(m.role==='ambusher')m.awake=true;
 m.intent={cells,power:skill.power};return {type:'announce',name:skill.name};
}
function drawCreatureMark(m,px,py){

 else if(m.creatureSkill==='bolt'){ctx.fillRect(px+12,py+3,2,9);ctx.fillRect(px+10,py+3,4,2)}

}

function selectBossVariant(all,floor,seed){
 const entry=Object.entries(EXTENDED_BOSSES).find(([,b])=>b.floor===floor);
 if(!entry||!Number.isInteger(seed))return all;
 let n=(seed^Math.imul(floor,0x85ebca6b)^0x68bc21eb)>>>0;n=Math.imul(n^(n>>>16),0x7feb352d);n=Math.imul(n^(n>>>15),0x846ca68b);n=(n^(n>>>16))>>>0;
 if(n%100>=50)return all;

 return all.map(m=>m.boss?{...m,boss,kind:b.name,color:b.color,ability:b.ability,phase:1,specialCD:0}:m);
}
function extendedBossAction(m,player,board,all=[]){
 const b=EXTENDED_BOSSES[m.boss];if(!Object.hasOwn(EXTENDED_BOSSES,m.boss))return null;
 const dist=(a,z)=>Math.max(Math.abs(a.x-z.x),Math.abs(a.y-z.y)),same=(a,z)=>a.x===z.x&&a.y===z.y;
 const ray=(a,z)=>{const n=dist(a,z);let prev=a;for(let i=1;i<=n;i++){const p={x:Math.round(a.x+(z.x-a.x)*i/n),y:Math.round(a.y+(z.y-a.y)*i/n)};if(!board.stepOK(p.x,p.y,prev.x,prev.y))return false;prev=p}return true};
 const phase=m.hp*3<=m.maxHp?3:m.hp*3<=2*m.maxHp?2:1;
 const changed=phase>(m.phase||1);m.phase=Math.max(m.phase||1,phase);
 const cd=m.phase===1?3:2;
 if(m.intent){const intent=m.intent;delete m.intent;m.specialCD=cd;return {type:'release',hit:intent.cells.some(p=>same(p,player))&&ray(m,player),power:intent.power,drain:!!b.drain,changed}}
 if(m.specialCD>0){m.specialCD--;return changed?{type:'phase',changed}:null}
 if(dist(m,player)>b.range||!ray(m,player))return changed?{type:'phase',changed}:null;
 const dx=Math.sign(player.x-m.x),dy=Math.sign(player.y-m.y);
 const offsets=b.pattern==='wall'?(Math.abs(player.x-m.x)>=Math.abs(player.y-m.y)?[[0,-1],[0,1]]:[[-1,0],[1,0]]):
 b.pattern==='diagonal'?[[-1,-1],[1,1],[-1,1],[1,-1]]:
 b.pattern==='beam'?[[-dx,-dy],[dx,dy]]:
 b.pattern==='cross'?[[1,0],[-1,0],[0,1],[0,-1]]:
 [[-dy,dx],[dy,-dx],[dx,dy]];
 const cells=[{x:player.x,y:player.y}];
 const add=(ox,oy)=>{const p={x:player.x+ox,y:player.y+oy};if(!same(p,m)&&!cells.some(z=>same(z,p))&&board.stepOK(p.x,p.y,player.x,player.y)&&ray(m,p))cells.push(p)};
 // Phase one uses two peripheral cells at most, later phases extend the pattern.
 for(const [ox,oy] of offsets.slice(0,m.phase===1?2:offsets.length))add(ox,oy);
 if(m.phase===3&&b.pattern==='beam'){add(-dy,dx);add(dy,-dx)}
 const escapes=[];
 for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++)if(x||y){
   const p={x:player.x+x,y:player.y+y};
   if(board.stepOK(p.x,p.y,player.x,player.y)&&!same(p,m)&&!all.some(z=>z.hp>0&&same(p,z)))escapes.push(p);
 }
 if(!escapes.length)return changed?{type:'phase',changed}:null;
 if(!escapes.some(p=>!cells.some(z=>same(z,p)))){
   const safe=escapes[0],i=cells.findIndex(p=>same(p,safe));if(i>0)cells.splice(i,1);
 }
 m.intent={cells,power:m.phase+1};
 return {type:'announce',changed};
}

// GAME-006D: deterministic merchants, optional gold field for legacy saves.
const MERCHANTS={
 arms:{name:'Armurier itinérant',color:'#d2a66c',slots:['weapon','armor','helmet'],goods:['heal','guard']},
 apothecary:{name:'Apothicaire',color:'#82c7a1',slots:['ring','boots'],goods:['heal','focus','guard','power','ward']},

const GOLD_CAP=99999;
function goldBalance(){return Math.max(0,Math.min(GOLD_CAP,Math.floor(Number(S?.gold)||0)))}
function goldReward(m,floor){const depth=Math.max(1,Math.min(30,floor));return m.boss?25+depth:m.rare?15+Math.floor(depth/2):m.elite?8+Math.floor(depth/3):2+Math.floor(depth/5)}
function gearPrice(it){const depth=Math.max(1,Math.min(30,Math.floor(Number(it.itemLevel)||1))),rarity=rarityOf(it);return 12+depth*2+[0,9,23,48,95][rarity-1]}
function salePrice(it){return Math.max(1,Math.floor(gearPrice(it)*0.4))}
function merchantStock(floor,seed,merchantId){
 const v=MERCHANTS[merchantId];if(!v)return [];
 let n=(seed^Math.imul(floor,0x9e3779b1)^0x26d08fa9)>>>0;
 const rnd=k=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return Math.floor(n/4294967296*k)};
 const stock=[],slots=Object.keys(GEAR_SLOTS),depth=Math.max(1,Math.min(30,floor));
 for(let i=0;i<(merchantId==='apothecary'?2:3);i++){
   const slot=v.slots[rnd(v.slots.length)];let first=true;
   const rarity=1+Number(depth>=5&&rnd(100)<70)+Number(depth>=10&&rnd(100)<45)+Number(depth>=20&&rnd(100)<25);
   const item=createGear(0,depth,1,k=>{if(first){first=false;return slots.indexOf(slot)}return rnd(k)},rarity);
   delete item.id;stock.push({kind:'gear',item,price:gearPrice(item),qty:1});
 }
 for(const id of v.goods.filter(id=>CONSUMABLES[id].min<=depth))stock.push({kind:'consumable',id,price:8+Math.floor(depth/3)+(['guard','power','ward'].includes(id)?4:0),qty:merchantId==='apothecary'?2:1});

}
function buildMerchant(d,decorated,terrain,loot,all,floor,W,H){
 if(floor<2||floor>30||(floor-2)%3!==0)return null;
 const used=new Set([d.start,d.stairs,...all,...loot,...decorated.features,...terrain].map(p=>p.y*W+p.x)),candidates=[];
 for(let y=d.start.y-5;y<=d.start.y+5;y++)for(let x=d.start.x-5;x<=d.start.x+5;x++){
   if(x<2||y<2||x>=W-2||y>=H-2||used.has(y*W+x)||Math.max(Math.abs(x-d.start.x),Math.abs(y-d.start.y))>5)continue;
   // Full open neighborhood prevents a non-walkable shop from blocking corridors.
   let open=true;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(decorated.map[(y+dy)*W+x+dx]!==0)open=false;
   if(open)candidates.push({x,y});
 }
 if(!candidates.length)return null;
 const n=(d.seed^Math.imul(floor,0x85ebca6b))>>>0,merchantId=['arms','apothecary','trader'][Math.floor((floor-2)/3)%3],p=candidates[n%candidates.length];

function merchantAvailable(f){

function canBuy(f,index){

function buyMerchant(f,index){

function sellMerchant(f,id){

function specialRoomAllowed(f,choice){

 if(choice==='protect')return S.shield<12;
 if(choice==='study')return S.level<30;

}
function resolveSpecialRoom(f,choice){
 if(!specialRoomAllowed(f,choice))return false;

 f.spent=true;f.choice=choice;selected=null;hide();
 if(choice==='rest'){S.hp=Math.min(S.maxHp,S.hp+14);S.res=Math.min(S.maxRes,S.res+6)}
 else if(choice==='protect')S.shield=12;
 else if(choice==='study')gainXP(12+floor*2);
 else if(choice==='scroll'){addConsumable('insight');addConsumable('ward')}
 else if(choice==='gold')S.gold=Math.min(GOLD_CAP,goldBalance()+15+floor*2);
 else if(choice==='gear'||choice==='relic')S.bag.push(createGear(++S.serial,floor,3));

    f.open=true;map[idx(f.x,f.y)]=0;say(f.type==='secret'?'Passage secret ouvert.':'Porte ouverte.');return true;

  }

const ENEMY_COLORS={guardian:'#e6ad65',brute:'#c87961',wanderer:'#bd777d',archer:'#91ab6e',ambusher:'#9282bb',coward:'#c0b58a',tracker:'#75b0b7'};
for(const entries of Object.values(BESTIARY))for(const [id,,color] of entries)ENEMY_COLORS[id]=color;
function enemyArtId(m){
 return Object.hasOwn(ENEMY_ART,m.species)?m.species:Object.hasOwn(ENEMY_ART,m.role)?m.role:'wanderer';
}
const ENEMY_ART_CACHE=new Map();
function enemySprite(m){
 const id=enemyArtId(m),base=ENEMY_COLORS[id];
 if(ENEMY_ART_CACHE.has(id))return ENEMY_ART_CACHE.get(id);
 const palette={o:'#151820',H:base,h:tileTint(base,1.35),e:['boneguard','wraith','frostfang','icecaller','voidstalker','riftspawn'].includes(id)?'#bdf4f3':'#ffe0a3'};
 const ops=[];
 ENEMY_ART[id].forEach((row,y)=>{for(let x=0;x<row.length;){const v=row[x];let end=x+1;while(end<row.length&&row[end]===v)end++;if(v!=='.')ops.push([palette[v],x+3,y+4,end-x,1]);x=end}});
 ENEMY_ART_CACHE.set(id,ops);return ops;
}
function drawEnemySprite(m,px,py){
 if(m.boss){ctx.fillStyle=m.color;ctx.fillRect(px+3,py+3,10,10);ctx.fillStyle='#251c20';ctx.fillRect(px+5,py+6,2,2);ctx.fillRect(px+9,py+6,2,2);if(m.role==='archer'){ctx.fillStyle='#e3d4aa';ctx.fillRect(px+12,py+4,2,8)}return}
 for(const [c,x,y,w,h] of enemySprite(m)){ctx.fillStyle=c;ctx.fillRect(px+x,py+y,w,h)}
}
function render(){if(!S)return;const biome=currentBiome(),VIEWW=canvas.width/T,VIEWH=canvas.height/T,ox=S.x-Math.floor(VIEWW/2),oy=S.y-Math.floor(VIEWH/2);ctx.fillStyle='#090e13';ctx.fillRect(0,0,canvas.width,canvas.height);for(let vy=0;vy<VIEWH;vy++)for(let vx=0;vx<VIEWW;vx++){let x=vx+ox,y=vy+oy,i=idx(x,y);if(!inside(x,y)||!seen[i])continue;let visible=los(x,y),wall=map[i]===1,px=vx*T,py=vy*T;drawBiomeTile(biome,x,y,wall,visible,px,py);drawTerrain(terrain.find(t=>t.x===x&&t.y===y),px,py,visible);drawFeature(featureAt(x,y),px,py,visible);if(visible&&monsters.some(m=>m.intent?.cells.some(p=>p.x===x&&p.y===y))){ctx.fillStyle='#813d3d';ctx.fillRect(px+1,py+1,14,14);ctx.strokeStyle='#ff9274';ctx.strokeRect(px+1,py+1,14,14)}if(visible&&x===stairs.x&&y===stairs.y){ctx.fillStyle='#e4c174';ctx.fillRect(px+3,py+3,10,10);ctx.fillStyle='#4c3825';ctx.fillRect(px+6,py+5,4,7)}}for(const l of loot){if(!los(l.x,l.y))continue;let px=(l.x-ox)*T,py=(l.y-oy)*T;ctx.fillStyle=l.kind==='gear'?(l.item?RARITIES[rarityOf(l.item)-1].color:'#85b8d5'):l.kind==='consumable'?(CONSUMABLES[l.consumable]?.color||'#a6b8ba'):'#c9b66c';if(l.kind==='consumable'){ctx.fillRect(px+7,py+2,3,3);ctx.fillRect(px+5,py+5,7,7)}else ctx.fillRect(px+5,py+4,7,8);ctx.fillStyle='#fff0ca';ctx.fillRect(px+7,py+5,2,2)}for(const m of monsters){if(!los(m.x,m.y))continue;let px=(m.x-ox)*T,py=(m.y-oy)*T;drawEnemySprite(m,px,py);drawCreatureMark(m,px,py);drawBossPhase(m,px,py);if(m.boss||m.rare){ctx.strokeStyle=m.rare?'#d6b7ff':'#e4a15d';ctx.strokeRect(px,py,16,16)}if(m.role==='guardian'||m.elite){ctx.fillStyle='#f1cd7b';ctx.fillRect(px+4,py+3,8,2)}if(m.aim){ctx.strokeStyle='#f2c979';ctx.strokeRect(px+1,py+1,14,14)}ctx.fillStyle='#3d2529';ctx.fillRect(px+2,py+1,12,2);ctx.fillStyle='#dfb17a';ctx.fillRect(px+2,py+1,Math.max(1,Math.round(12*m.hp/m.maxHp)),2)}let px=(S.x-ox)*T,py=(S.y-oy)*T;drawPlayerSprite(px,py);if(selected!==null){ctx.strokeStyle='#f2c979';ctx.strokeRect(px+1,py+1,14,14)}}
