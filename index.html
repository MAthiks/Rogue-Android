.panel{touch-action:pan-y}.panel select{background:#344453;color:#fff;padding:9px;border-radius:6px;width:100%;font-size:16px}.panel label{display:block;margin-top:12px}.pad{grid-template-columns:repeat(3,var(--padw,46px));grid-template-rows:repeat(3,var(--padh,43px))}main{overflow:hidden}canvas{object-fit:fill;flex:none}</style></head><body><div id="app"><header><strong>ROGUE <span style="color:#9baebc">GAME-003B.5</span></strong><span id="stats">Android · tour par tour</span></header><main><canvas id="game" width="640" height="384" aria-label="Carte du donjon"></canvas></main><footer><div class="pad" id="pad"><button data-d="-1,-1" aria-label="Nord-ouest">↖</button><button data-d="0,-1" aria-label="Nord">↑</button><button data-d="1,-1" aria-label="Nord-est">↗</button><button data-d="-1,0" aria-label="Ouest">←</button><button id="wait" aria-label="Attendre">●</button><button data-d="1,0" aria-label="Est">→</button><button data-d="-1,1" aria-label="Sud-ouest">↙</button><button data-d="0,1" aria-label="Sud">↓</button><button data-d="1,1" aria-label="Sud-est">↘</button></div><div class="right"><div id="log" aria-live="polite">Choisis une classe.</div><div class="skills"><button data-skill="0">Talent 1</button><button data-skill="1">Talent 2</button><button data-skill="2">Talent 3</button></div><div class="tools"><button id="bandage">Bandage</button><button id="inventory">Équipement</button><button id="menu">Menu</button></div><div class="tiny">8 directions uniquement · hors ligne · sauvegarde locale</div></div></footer></div><div id="overlay"><div class="panel" id="panel"></div></div><script>
(()=>{'use strict';
const W=48,H=32,T=16,VIEWW=40,VIEWH=24,KEY='rogue-android-game002-v1',canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),log=document.getElementById('log'),stats=document.getElementById('stats'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');
const CLASSES={warrior:{name:'Guerrier',desc:'Robuste · parade et frappe',hp:28,res:'Endurance',maxRes:12,color:'#a5c8ce',skills:[['Frappe',3,3,'direction'],['Souffle',4,6,'heal'],['Garde',2,5,'guard']]},rogue:{name:'Voleur',desc:'Rapide · critique et esquive',hp:21,res:'Énergie',maxRes:14,color:'#b8c49a',skills:[['Estoc',3,3,'direction'],['Esquive',3,5,'guard'],['Focus',2,5,'boost']]},ranger:{name:'Rôdeur',desc:'Précis · tirs et survie',hp:23,res:'Concentration',maxRes:12,color:'#d2bd88',skills:[['Tir',3,3,'ranged'],['Soin',4,6,'heal'],['Visée',2,5,'boost']]},mage:{name:'Arcaniste',desc:'Fragile · magie à distance',hp:18,res:'Mana',maxRes:16,color:'#b4a8db',skills:[['Éclair',4,3,'ranged'],['Soin',5,6,'heal'],['Barrière',3,5,'guard']]}};
const ADV={warrior:[['Brise-garde',5,5,'direction'],['Bastion',5,8,'guard']],rogue:[['Exécution',6,5,'direction'],['Disparition',4,8,'guard']],ranger:[['Tir perforant',5,5,'ranged'],['Second souffle',5,8,'heal']],mage:[['Décharge',6,5,'ranged'],['Égide',5,8,'guard']]};for(const k of Object.keys(ADV))CLASSES[k].skills.push(...ADV[k]);const unlocked=i=>i<3||!!S.activeTalents[i];const PREF='rogue-android-display-v1';let prefs={zoom:100,pad:100};try{const p=JSON.parse(localStorage.getItem(PREF));if(p){if([75,100,125,150,200].includes(p.zoom))prefs.zoom=p.zoom;if([85,100,115].includes(p.pad))prefs.pad=p.pad}}catch(e){};
function applyPrefs(){const small=innerHeight<=430;document.documentElement.style.setProperty('--padw',Math.round((small?42:46)*prefs.pad/100)+'px');document.documentElement.style.setProperty('--padh',Math.round((small?38:43)*prefs.pad/100)+'px');try{localStorage.setItem(PREF,JSON.stringify(prefs))}catch(e){};resizeMap()}
function resizeMap(){const m=canvas.parentElement;const w=Math.max(16,m.clientWidth-6),h=Math.max(16,m.clientHeight-6);const scale= Math.max(1,Math.floor(Math.min(w/40,h/24)/16*16));const tile=Math.max(1,Math.round(scale*prefs.zoom/100));canvas.width=Math.max(1,Math.floor(w/tile))*T;canvas.height=Math.max(1,Math.floor(h/tile))*T;canvas.style.width=(canvas.width/T*tile)+'px';canvas.style.height=(canvas.height/T*tile)+'px';render()}
function options(back){show(`<h1>Options graphiques</h1><label for="zoom">Zoom du donjon</label><select id="zoom">${[75,100,125,150,200].map(n=>`<option value="${n}" ${prefs.zoom===n?'selected':''}>${n}%</option>`).join('')}</select><label for="padsize">Taille du pavé</label><select id="padsize">${[85,100,115].map(n=>`<option value="${n}" ${prefs.pad===n?'selected':''}>${n}%</option>`).join('')}</select><button class="wide" id="full">Basculer plein écran</button><p id="fullstatus" aria-live="polite"></p><button class="wide" id="defaults">Réglages par défaut</button><button class="wide" id="optback">Retour</button>`);document.getElementById('zoom').onchange=e=>{prefs.zoom=+e.target.value;applyPrefs()};document.getElementById('padsize').onchange=e=>{prefs.pad=+e.target.value;applyPrefs()};document.getElementById('defaults').onclick=()=>{prefs={zoom:100,pad:100};applyPrefs();options(back)};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.getElementById('fullstatus').textContent='Plein écran indisponible dans ce navigateur.'}};document.getElementById('optback').onclick=back}
let S=null,map=[],seen=[],monsters=[],loot=[],stairs=null,selected=null,mode='start',messages=[];
const rand=n=>Math.floor(Math.random()*n),idx=(x,y)=>y*W+x,inside=(x,y)=>x>=0&&y>=0&&x<W&&y<H,clear=(x,y)=>inside(x,y)&&map[idx(x,y)]===0,dist=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y));
function say(t){messages.unshift(t);messages=messages.slice(0,3);log.textContent=messages.join(' · ')}
function show(html){panel.innerHTML=html;overlay.classList.remove('hidden')}
function hide(){overlay.classList.add('hidden')}
function save(){if(S&&!S.dead){try{localStorage.setItem(KEY,JSON.stringify({S,map,seen,monsters,loot,stairs}))}catch(e){say('Sauvegarde indisponible.')}}}
function restore(){try{let d=JSON.parse(localStorage.getItem(KEY));if(!d||!CLASSES[d.S?.classId]||d.S.dead||d.map.length!==W*H||d.seen.length!==W*H)return false;({S,map,seen,monsters,loot,stairs}=d);migrate();return true}catch(e){return false}}
const ATTR=['Force','Dextérité','Constitution','Volonté','Intelligence','Perception'];
const BASE={warrior:[4,2,4,2,1,2],rogue:[2,4,2,2,1,4],ranger:[2,4,2,3,1,4],mage:[1,2,2,4,4,2]};
function migrate(){S.attrs??=[...BASE[S.classId]];S.ap??=0;S.ranks??=[1,1,1];S.bag??=[];S.equip??={weapon:null,armor:null,ring:null};S.serial??=0;S.spec??=null;S.nodes??={};S.activeTalents??={};S.veil??=0;S.shield??=0;S.bar??=[0,1,2];if(!Array.isArray(S.bar)||S.bar.length!==3||new Set(S.bar).size!==3||S.bar.some(i=>!Number.isInteger(i)||i<0||i>4||!unlocked(i)))S.bar=[0,1,2];while(S.cool.length<5)S.cool.push(0);while(S.ranks.length<5)S.ranks.push(1);S.equip.helmet??=null;S.equip.boots??=null;S.serial=Math.max(S.serial,...S.bag.map(i=>i.id||0),...Object.values(S.equip).map(i=>i?.id||0))}
function bonus(k){return Object.values(S.equip).reduce((n,i)=>n+(i?.[k]||0),0)}
function item(){let slot=['weapon','armor','ring','helmet','boots'][rand(5)],r=rand(100),tier=r<5?3:r<25?2:1;return {id:++S.serial,slot,name:['','Commun','Rare','Épique'][tier]+' · '+({weapon:'Arme',armor:'Armure',ring:'Anneau',helmet:'Casque',boots:'Bottes'}[slot]),atk:slot==='weapon'?tier:slot==='ring'?tier:0,def:slot==='armor'?tier:slot==='helmet'||slot==='boots'?Math.max(1,tier-1):0,crit:tier>1?rand(5)+1:0,regen:tier===3?1:0}}
function startMenu(){mode='start';const resume=!!localStorage.getItem(KEY);show('<h1>ROGUE <small>Android</small></h1><p>Roguelike tactique en pixel art. Mort permanente, exploration procédurale et commandes exclusivement au pavé à huit directions.</p>'+(resume?'<button class="wide" id="resume">Reprendre la partie</button>':'')+'<button class="wide" id="startopts">Options graphiques</button><h2>Nouvelle partie</h2><div class="classes">'+Object.entries(CLASSES).map(([k,c])=>`<button data-class="${k}"><b>${c.name}</b><small>${c.desc}</small></button>`).join('')+'</div><p class="tiny">Une nouvelle partie remplace la sauvegarde précédente.</p>');document.getElementById('startopts').onclick=()=>options(startMenu);panel.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>newGame(b.dataset.class));if(resume)document.getElementById('resume').onclick=()=>{if(restore()){mode='game';hide();say('Partie reprise.');update()}else{localStorage.removeItem(KEY);startMenu()}}}
function newGame(id){let c=CLASSES[id];S={classId:id,x:0,y:0,hp:c.hp,maxHp:c.hp,res:c.maxRes,maxRes:c.maxRes,level:1,xp:0,points:0,floor:1,turn:0,bandages:3,atk:0,armor:0,guard:0,boost:0,cool:[0,0,0],kills:0,dead:false};migrate();selected=null;generate();mode='game';hide();say('Un nouveau destin commence.');update();save()}
function generate(){let rooms=[];map=Array(W*H).fill(1);for(let n=0;n<180&&rooms.length<15;n++){let w=5+rand(6),h=4+rand(5),x=1+rand(W-w-2),y=1+rand(H-h-2);if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;let r={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)};for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)map[idx(xx,yy)]=0;if(rooms.length){let q=rooms[rooms.length-1],carve=(xx,yy)=>{map[idx(xx,yy)]=0};if(rand(2)){for(let xx=Math.min(q.cx,r.cx);xx<=Math.max(q.cx,r.cx);xx++)carve(xx,q.cy);for(let yy=Math.min(q.cy,r.cy);yy<=Math.max(q.cy,r.cy);yy++)carve(r.cx,yy)}else{for(let yy=Math.min(q.cy,r.cy);yy<=Math.max(q.cy,r.cy);yy++)carve(q.cx,yy);for(let xx=Math.min(q.cx,r.cx);xx<=Math.max(q.cx,r.cx);xx++)carve(xx,r.cy)}}rooms.push(r)}if(rooms.length<3){generate();return}seen=Array(W*H).fill(0);S.x=rooms[0].cx;S.y=rooms[0].cy;stairs={x:rooms.at(-1).cx,y:rooms.at(-1).cy};monsters=[];loot=[];for(let i=1;i<rooms.length;i++){let r=rooms[i],count=1+(rand(3)===0?1:0);for(let j=0;j<count;j++){let x=r.x+rand(r.w),y=r.y+rand(r.h);if((x===stairs.x&&y===stairs.y)||monsters.some(m=>m.x===x&&m.y===y))continue;let elite=S.floor%3===0&&i===rooms.length-1&&j===0,brute=!elite&&rand(4)===0;let hp=elite?16+S.floor*2:brute?8+S.floor:4+Math.floor(S.floor/2);monsters.push({x,y,hp,maxHp:hp,atk:elite?5:brute?3:2,kind:elite?'Gardien':brute?'Brute':'Errant',elite,color:elite?'#e6ad65':brute?'#c87961':'#bd777d'})}if(rand(3)===0)loot.push({x:r.cx,y:r.cy,kind:rand(3)===0?'gear':'bandage'})}reveal()}
function los(x,y){let dx=x-S.x,dy=y-S.y;if(dx*dx+dy*dy>100)return false;let n=Math.max(Math.abs(dx),Math.abs(dy));for(let i=1;i<n;i++)if(!clear(Math.round(S.x+dx*i/n),Math.round(S.y+dy*i/n)))return false;return true}
function reveal(){for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(los(x,y))seen[idx(x,y)]=1}
function stepOK(x,y,fx,fy){if(!clear(x,y))return false;let dx=x-fx,dy=y-fy;return !(dx&&dy&&(!clear(fx+dx,fy)||!clear(fx,fy+dy)))}
function mob(x,y){return monsters.find(m=>m.hp>0&&m.x===x&&m.y===y)}
function gainXP(n){if(S.level>=30){S.xp=0;return}S.xp+=n;let threshold=8+S.level*6;while(S.level<30&&S.xp>=threshold){S.xp-=threshold;S.level++;threshold=8+S.level*6;S.points++;S.ap+=2;S.maxHp+=4;S.hp=Math.min(S.maxHp,S.hp+8);S.maxRes+=1;S.res=S.maxRes;say('Niveau '+S.level+' ! +4 PV max, +1 ressource,  +2 caractéristiques, +1 talent.')}if(S.level>=30)S.xp=0}
function kill(m){monsters=monsters.filter(x=>x!==m);S.kills++;gainXP(m.elite?12:4);if(rand(5)===0)loot.push({x:m.x,y:m.y,kind:rand(3)===0?'gear':'bandage'});say(m.kind+' vaincu !')}
function hit(m,damage){let d=Math.max(1,damage+S.atk+bonus('atk')+Math.floor(S.attrs[S.classId==='mage'?4:S.classId==='warrior'?0:1]/4)+(S.boost>0?3:0));if(S.spec==='offense')d+=2;if(m.exposed>0)d+=2;if(S.nodes.o1)d++;if(S.nodes.master)d+=2;if(rand(100)<Math.min(35,3+S.attrs[5]*2+bonus('crit')+(S.classId==='rogue'?5:0)+(S.nodes.o2?8:0)))d=Math.ceil(d*1.5);m.hp-=d;S.boost=0;say(m.kind+' : -'+d+' PV');if(m.hp<=0)kill(m)}
function enemyPhase(){for(const m of [...monsters]){if(S.dead)break;if(m.bleed>0){m.bleed--;m.hp-=2;say(m.kind+' saigne : -2 PV');if(m.hp<=0){kill(m);continue}}if(m.exposed>0)m.exposed--;if(m.stun>0){m.stun--;continue}let d=dist(m,S);if(d===1&&stepOK(S.x,S.y,m.x,m.y)){if(S.veil>0){S.veil=0;say('Attaque évitée par Disparition.');continue}if(rand(100)<Math.min(25,S.attrs[1]+(S.nodes.d2?5:0)+(S.spec==='defense'?5:0))){say('Attaque esquivée.');continue}let dmg=Math.max(1,m.atk+rand(2)-S.armor-bonus('def')-Math.floor(S.attrs[2]/6)-(S.guard>0?2:0)-(S.spec==='defense'?1:0)-(S.nodes.d1?1:0));if(S.shield>0){let absorbed=Math.min(dmg,S.shield);S.shield-=absorbed;dmg-=absorbed}S.hp=Math.max(0,S.hp-dmg);say(m.kind+' te frappe : -'+dmg+' PV');if(S.hp===0)die();continue}if(d>8||!los(m.x,m.y))continue;let opts=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let x=m.x+dx,y=m.y+dy;if(!stepOK(x,y,m.x,m.y)||mob(x,y)||(x===S.x&&y===S.y))continue;opts.push({x,y,d:Math.max(Math.abs(x-S.x),Math.abs(y-S.y))})}opts.sort((a,b)=>a.d-b.d);if(opts.length&&opts[0].d<d){m.x=opts[0].x;m.y=opts[0].y}}}
function finish(){S.turn++;enemyPhase();if(S.dead)return;S.veil=Math.max(0,S.veil-1);S.cool=S.cool.map(x=>Math.max(0,x-1));S.guard=Math.max(0,S.guard-1);S.boost=Math.max(0,S.boost-1);S.res=Math.min(S.maxRes,S.res+1+(S.classId==='rogue'&&S.turn%2===0?1:0)+Math.min(2,Math.floor(S.attrs[3]/12))+Math.min(2,bonus('regen'))+(S.nodes.master?1:0));reveal();update();save()}
function die(){S.dead=true;mode='dead';localStorage.removeItem(KEY);show(`<h1>Mort permanente</h1><p>${CLASSES[S.classId].name} niveau ${S.level} · étage ${S.floor} · ${S.kills} ennemis vaincus · ${S.turn} tours.</p><p>Cette partie est terminée. Sa sauvegarde a été supprimée.</p><button class="wide" id="again">Nouvelle partie</button>`);document.getElementById('again').onclick=startMenu}
function move(dx,dy){if(mode!=='game'||!overlay.classList.contains('hidden'))return;if(selected!==null){useDirection(dx,dy);return}let x=S.x+dx,y=S.y+dy;if(!stepOK(x,y,S.x,S.y)){say('Passage ou angle bloqué.');return}let m=mob(x,y);if(m){hit(m,2+rand(3));finish();return}S.x=x;S.y=y;let found=loot.find(l=>l.x===x&&l.y===y);if(found){loot=loot.filter(l=>l!==found);if(found.kind==='bandage'){S.bandages++;say('Bandage trouvé.')}else{if(S.bag.length<24){let it=found.item??item();S.bag.push(it);say(it.name+' trouvé.')}else{found.item??=item();loot.push(found);say('Sac plein.')} }}if(x===stairs.x&&y===stairs.y){S.floor++;S.hp=Math.min(S.maxHp,S.hp+4);S.res=S.maxRes;generate();say('Étage '+S.floor+' · +4 PV.')}finish()}
function activate(i){if(mode!=='game'||!overlay.classList.contains('hidden'))return;i=S.bar[i];if(!unlocked(i))return;let c=CLASSES[S.classId],sk=c.skills[i],cost=sk[1];if(S.cool[i]||S.res<cost){say('Compétence indisponible.');return}if(sk[3]==='direction'||sk[3]==='ranged'){selected=selected===i?null:i;say(selected===null?'Ciblage annulé.':'Choisis une direction sur le pavé.');update();return}if(sk[3]==='heal'&&S.hp===S.maxHp){say('PV déjà au maximum.');return}selected=null;S.res-=cost;S.cool[i]=sk[2]+1;if(sk[3]==='heal'){let n=Math.min(7+S.level+2*(S.ranks[i]-1)+Math.floor(S.attrs[4]/3)+(i===4?5:0),S.maxHp-S.hp);S.hp+=n;if(i===4&&S.classId==='ranger')S.res=Math.min(S.maxRes,S.res+4);say('Soin : +'+n+' PV.')}else if(sk[3]==='guard'){S.guard=2+S.ranks[i]+(i===4?3:0);if(i===4&&S.classId==='rogue')S.veil=3;if(S.classId==='mage')S.shield=Math.max(S.shield,4+S.ranks[i]*2+(i===4?6:0));say('Protection activée.')}else{S.boost=3+S.ranks[i];say('Prochaine attaque renforcée.')}finish()}
function useDirection(dx,dy){let i=selected;selected=null;let sk=CLASSES[S.classId].skills[i],target=null,targets=[];if(!unlocked(i)||S.cool[i]||S.res<sk[1]){update();return}if(sk[3]==='direction'){let x=S.x+dx,y=S.y+dy;if(stepOK(x,y,S.x,S.y))target=mob(x,y)}else{for(let k=1;k<=5;k++){let x=S.x+dx*k,y=S.y+dy*k;if(!clear(x,y))break;if(!stepOK(x,y,x-dx,y-dy))break;let m=mob(x,y);if(m){targets.push(m);target??=m;if(!(i===3&&S.classId==='ranger'))break}}}if(!target){say('Aucune cible dans cette direction.');update();return}S.res-=sk[1];S.cool[i]=sk[2]+1;let damage=(sk[3]==='ranged'?5:6)+rand(3)+Math.floor(S.level/3)+2*(S.ranks[i]-1)+(i===3?4+(S.nodes.o2?2:0):0);if(S.classId==='rogue'&&i===3&&target.hp<=target.maxHp/2)damage+=5;hit(target,damage);if(monsters.includes(target)){if(S.classId==='warrior'&&i===3)target.exposed=4;if(S.classId==='rogue')target.bleed=3;if(S.classId==='mage'&&i===3)target.stun=1}if(S.classId==='ranger'&&i===3)for(const m of targets.slice(1))if(monsters.includes(m))hit(m,Math.max(1,Math.floor(damage/2)));finish()}
function bandage(){if(mode!=='game'||!overlay.classList.contains('hidden')||S.bandages<1||S.hp===S.maxHp)return;S.bandages--;let n=Math.min(9,S.maxHp-S.hp);S.hp+=n;say('Bandage : +'+n+' PV.');finish()}
function update(){if(!S)return;stats.textContent=`${CLASSES[S.classId].name} N${S.level} · PV ${S.hp}/${S.maxHp} · ${CLASSES[S.classId].res} ${S.res}/${S.maxRes} · Étage ${S.floor} · T${S.turn}`;document.getElementById('bandage').textContent='Bandage ('+S.bandages+')';document.querySelectorAll('[data-skill]').forEach(b=>{let i=S.bar[+b.dataset.skill],s=CLASSES[S.classId].skills[i];b.textContent=s[0]+(S.cool[i]?' · '+S.cool[i]:'');b.disabled=mode!=='game'||S.cool[i]>0||S.res<s[1];b.classList.toggle('active',selected===i)});render()}
function render(){if(!S)return;const VIEWW=canvas.width/T,VIEWH=canvas.height/T,ox=S.x-Math.floor(VIEWW/2),oy=S.y-Math.floor(VIEWH/2);ctx.fillStyle='#090e13';ctx.fillRect(0,0,canvas.width,canvas.height);for(let vy=0;vy<VIEWH;vy++)for(let vx=0;vx<VIEWW;vx++){let x=vx+ox,y=vy+oy,i=idx(x,y);if(!inside(x,y)||!seen[i])continue;let visible=los(x,y),wall=map[i]===1,px=vx*T,py=vy*T;ctx.fillStyle=wall?(visible?'#515d65':'#252e36'):(visible?'#293c40':'#17252c');ctx.fillRect(px,py,T,T);if(wall){ctx.fillStyle=visible?'#74838a':'#303d45';ctx.fillRect(px,py,16,3);ctx.fillRect(px+1,py+4,2,8)}else{ctx.fillStyle=visible?'#3e5252':'#26363b';ctx.fillRect(px+3,py+4,2,2);ctx.fillRect(px+11,py+12,2,2)}if(visible&&x===stairs.x&&y===stairs.y){ctx.fillStyle='#e4c174';ctx.fillRect(px+3,py+3,10,10);ctx.fillStyle='#4c3825';ctx.fillRect(px+6,py+5,4,7)}}for(const l of loot){if(!los(l.x,l.y))continue;let px=(l.x-ox)*T,py=(l.y-oy)*T;ctx.fillStyle=l.kind==='gear'?'#85b8d5':'#c9b66c';ctx.fillRect(px+5,py+4,7,8);ctx.fillStyle='#fff0ca';ctx.fillRect(px+7,py+5,2,2)}for(const m of monsters){if(!los(m.x,m.y))continue;let px=(m.x-ox)*T,py=(m.y-oy)*T;ctx.fillStyle=m.color;ctx.fillRect(px+3,py+3,10,10);ctx.fillStyle='#251c20';ctx.fillRect(px+5,py+6,2,2);ctx.fillRect(px+9,py+6,2,2);ctx.fillStyle='#3d2529';ctx.fillRect(px+2,py+1,12,2);ctx.fillStyle='#dfb17a';ctx.fillRect(px+2,py+1,Math.max(1,Math.round(12*m.hp/m.maxHp)),2)}let px=(S.x-ox)*T,py=(S.y-oy)*T;ctx.fillStyle='#111d28';ctx.fillRect(px+2,py+2,12,13);ctx.fillStyle=CLASSES[S.classId].color;ctx.fillRect(px+5,py+4,6,6);ctx.fillStyle='#cba76d';ctx.fillRect(px+6,py+11,4,3);if(selected!==null){ctx.strokeStyle='#f2c979';ctx.strokeRect(px+1,py+1,14,14)}}
function legacyInventory(){if(mode!=='game')return;show(`<h1>Personnage</h1><p><b>${CLASSES[S.classId].name}</b> · niveau ${S.level} · ${S.xp}/${8+S.level*6} XP<br>Attaque +${S.atk} · Armure +${S.armor} · Bandages ${S.bandages}<br>Ennemis vaincus : ${S.kills}</p><p>Points de talent : <b>${S.points}</b></p><p>Investis un point pour augmenter tes dégâts ou ta santé maximale.</p><button class="wide" id="upatk" ${S.points?'':'disabled'}>+1 Attaque (1 point)</button><button class="wide" id="uphp" ${S.points?'':'disabled'}>+5 PV maximum (1 point)</button><button class="wide" id="close">Retour au donjon</button>`);document.getElementById('close').onclick=hide;for(let [id,key] of [['upatk','atk'],['uphp','hp']])document.getElementById(id).onclick=()=>{if(!S.points)return;S.points--;if(key==='atk')S.atk++;else{S.maxHp+=5;S.hp+=5}save();update();inventory()}}
const SPECS={warrior:['Berserker','Sentinelle'],rogue:['Assassin','Duelliste'],ranger:['Tireur','Survivant'],mage:['Évocateur','Protecteur']};
const ATTRHELP=['Dégâts du guerrier','Dégâts du voleur et du rôdeur, esquive','PV et défense','Ressource maximale et régénération','Dégâts magiques et soins','Chance de critique'];
function inventory(){if(mode!=='game')return;selected=null;update();show('<h1>Personnage</h1><p>'+CLASSES[S.classId].name+' · Niveau '+S.level+' · XP '+S.xp+'/'+(8+S.level*6)+'</p><h2>Caractéristiques ('+S.ap+' points)</h2><div class="classes">'+ATTR.map((a,i)=>'<button data-attr="'+i+'" '+(!S.ap?'disabled':'')+'>'+a+' : '+S.attrs[i]+' (+1)<small>'+ATTRHELP[i]+'</small></button>').join('')+'</div><h2>Talents ('+S.points+' points)</h2>'+CLASSES[S.classId].skills.map((a,i)=>'<button class="wide" data-rank="'+i+'" '+(!unlocked(i)||!S.points||S.ranks[i]>=5||S.level<S.ranks[i]*2?'disabled':'')+'>'+a[0]+' · rang '+S.ranks[i]+'/5 · prochain niveau requis '+(S.ranks[i]*2)+'</button>').join('')+'<h2>Équipement</h2><p>Attaque +'+(S.atk+bonus('atk'))+' · Défense +'+(S.armor+bonus('def'))+'</p>'+Object.entries(S.equip).map(([k,it])=>'<button class="wide" data-off="'+k+'" '+(!it||S.bag.length>=24?'disabled':'')+'>'+({weapon:'Arme',armor:'Armure',ring:'Anneau',helmet:'Casque',boots:'Bottes'}[k])+': '+(it?it.name+' · retirer':'vide')+'</button>').join('')+'<h2>Sac '+S.bag.length+'/24</h2>'+S.bag.map(it=>'<div><button class="wide" data-equip="'+it.id+'">'+it.name+' · ATQ +'+it.atk+' DEF +'+it.def+' CRIT +'+(it.crit||0)+'% REG +'+(it.regen||0)+' · équiper</button><button class="wide" data-drop="'+it.id+'">Jeter</button></div>').join('')+'<button class="wide" id="close">Retour au donjon</button>');const spec=document.createElement('section');spec.innerHTML='<h2>Spécialisation</h2>'+(S.spec?'<p>'+SPECS[S.classId][S.spec==='offense'?0:1]+'</p>':S.level<5?'<p>Débloquée au niveau 5.</p>':'<div class="classes"><button data-spec="offense">'+SPECS[S.classId][0]+'<small>+2 dégâts</small></button><button data-spec="defense">'+SPECS[S.classId][1]+'<small>+1 défense, +5% esquive</small></button></div>');panel.querySelector('h2').before(spec);const refresh=()=>{save();update();inventory()};const tree=document.createElement('section');const names={warrior:['Force brute','Fureur','Armure renforcée','Réflexes','Maître d’armes'],rogue:['Lame affûtée','Précision mortelle','Souplesse','Pas furtif','Maître des ombres'],ranger:['Flèche lourde','Œil de lynx','Peau dure','Instinct','Maître pisteur'],mage:['Puissance arcanique','Surcharge','Peau de pierre','Voile','Maître des arcanes']}[S.classId];const nodes=[['o1',2,[], '+1 dégât'],['o2',5,['o1'],'+8% critique'],['d1',2,[],'+1 défense'],['d2',5,['d1'],'+5% esquive'],['master',10,['o2','d2'],'+2 dégâts, +1 régénération']];const eligible=n=>S.points>0&&!S.nodes[n[0]]&&S.level>=n[1]&&n[2].every(k=>S.nodes[k]);tree.innerHTML='<h2>Arbre de talents passifs</h2><p>Chaque talent coûte 1 point. Maîtrise : les deux branches avancées requises.</p><div class="classes">'+nodes.map((n,i)=>'<button data-node="'+i+'" '+(eligible(n)?'':'disabled')+'>'+names[i]+'<small>'+n[3]+' · Niv. '+n[1]+(S.nodes[n[0]]?' · acquis':n[2].length?' · prérequis : '+n[2].map(k=>names[nodes.findIndex(x=>x[0]===k)]).join(', '):'')+'</small></button>').join('')+'</div>';panel.querySelector('[data-rank]').before(tree);const active=document.createElement('section');const canLearn=i=>!unlocked(i)&&S.points>0&&S.level>= (i===3?5:8)&&S.nodes[i===3?'o1':'d1'];active.innerHTML='<h2>Compétences avancées</h2>'+[3,4].map(i=>'<button class="wide" data-learn="'+i+'" '+(canLearn(i)?'':'disabled')+'>'+CLASSES[S.classId].skills[i][0]+' · '+(unlocked(i)?'acquis':'1 point · niveau '+(i===3?5:8)+' · branche '+(i===3?'offensive':'défensive'))+'</button>').join('')+'<h2>Barre de compétences</h2>'+S.bar.map((v,j)=>'<label>Emplacement '+(j+1)+'</label><select data-bar="'+j+'">'+CLASSES[S.classId].skills.map((sk,i)=>unlocked(i)?'<option value="'+i+'" '+(v===i?'selected':'')+'>'+sk[0]+'</option>':'').join('')+'</select>').join('');tree.before(active);active.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{let i=+b.dataset.learn;if(canLearn(i)){S.points--;S.activeTalents[i]=true;refresh()}});active.querySelectorAll('[data-bar]').forEach(b=>b.onchange=()=>{let j=+b.dataset.bar,i=+b.value;if(!unlocked(i))return;let other=S.bar.indexOf(i);if(other>=0)S.bar[other]=S.bar[j];S.bar[j]=i;refresh()});tree.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{let n=nodes[+b.dataset.node];if(eligible(n)){S.points--;S.nodes[n[0]]=true;refresh()}});panel.querySelectorAll('[data-spec]').forEach(b=>b.onclick=()=>{if(S.level>=5&&!S.spec&&confirm('Choisir définitivement cette spécialisation ?')){S.spec=b.dataset.spec;refresh()}});panel.querySelectorAll('[data-attr]').forEach(b=>b.onclick=()=>{if(!S.ap)return;let i=+b.dataset.attr;S.ap--;S.attrs[i]++;if(i===2){S.maxHp+=2;S.hp+=2}if(i===3){S.maxRes++;S.res++}refresh()});panel.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{let i=+b.dataset.rank;if(!unlocked(i)||!S.points||S.ranks[i]>=5||S.level<S.ranks[i]*2)return;S.points--;S.ranks[i]++;refresh()});panel.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{let i=S.bag.findIndex(it=>it.id===+b.dataset.equip);if(i<0)return;let it=S.bag.splice(i,1)[0];if(S.equip[it.slot])S.bag.push(S.equip[it.slot]);S.equip[it.slot]=it;refresh()});panel.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>{let k=b.dataset.off;if(S.equip[k]&&S.bag.length<24){S.bag.push(S.equip[k]);S.equip[k]=null;refresh()}});panel.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{if(confirm('Jeter cet objet ?')){S.bag=S.bag.filter(it=>it.id!==+b.dataset.drop);refresh()}});document.getElementById('close').onclick=hide}
function menu(){if(mode!=='game')return;selected=null;update();show(`<h1>Pause</h1><p>Partie sauvegardée automatiquement sur cet appareil. Une mort supprime la sauvegarde.</p><button class="wide" id="back">Continuer</button><button class="wide" id="pauseopts">Options graphiques</button><button class="wide" id="reset">Abandonner et recommencer</button>`);document.getElementById('back').onclick=hide;document.getElementById('pauseopts').onclick=()=>options(menu);document.getElementById('reset').onclick=()=>{if(confirm('Abandonner définitivement cette partie ?')){localStorage.removeItem(KEY);S=null;startMenu()}}}
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();let [dx,dy]=b.dataset.d.split(',').map(Number);move(dx,dy)}));document.getElementById('wait').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='game'&&overlay.classList.contains('hidden')){selected=null;say('Tu attends.');finish()}});document.querySelectorAll('[data-skill]').forEach(b=>b.addEventListener('click',()=>activate(+b.dataset.skill)));document.getElementById('bandage').onclick=bandage;document.getElementById('inventory').onclick=inventory;document.getElementById('menu').onclick=menu;document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});startMenu();applyPrefs();window.addEventListener("resize",applyPrefs);if(typeof ResizeObserver!=="undefined")new ResizeObserver(resizeMap).observe(canvas.parentElement);
})();
</script></body></html>
