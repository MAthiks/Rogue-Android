<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<title>CRYPTGRAVE — Android</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><style>
/* TECH-012C — Base de l'interface : dimensions, couleurs et commandes tactiles. */
*{
  box-sizing:border-box
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#0b1017;
  color:#eee5d4;
  font:13px system-ui,sans-serif;
  overflow:hidden;
  touch-action:none
}
#app{
  height:100dvh;
  display:flex;
  flex-direction:column
}
header{
  height:39px;
  background:#1c2731;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  gap:8px
}
header strong{
  color:#e3b97d
}
#stats{
  font-size:12px;
  text-align:right
}
main{
  flex:1;
  min-height:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:3px
}
canvas{
  width:100%;
  height:100%;
  object-fit:contain;
  image-rendering:pixelated;
  background:#080d12
}
footer{
  background:#1c2731;
  min-height:156px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left))
}
.pad{
  display:grid;
  grid-template-columns:repeat(3,46px);
  grid-template-rows:repeat(3,43px);
  gap:3px;
  flex:none
}
button{
  border:1px solid #657483;
  background:#344453;
  color:#f8edd7;
  border-radius:8px;
  touch-action:manipulation;
  user-select:none;
  cursor:pointer
}
button:active{
  background:#a37b4c
}
.pad button{
  font-size:24px;
  font-weight:700
}
.pad #wait{
  color:#d3ad76;
  background:#25313e
}
.right{
  flex:1;
  min-width:0;
  max-width:520px;
  display:flex;
  flex-direction:column;
  gap:5px
}
.skills,.tools{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:4px
}
.skills button,.tools button{
  min-height:32px;
  font-size:11px;
  padding:3px 2px
}
.tools button{
  min-height:28px
}
.skills button.active{
  outline:2px solid #e9bd76;
  background:#77583a
}
.skills button:disabled{
  opacity:.45
}
#log{
  height:31px;
  overflow:hidden;
  color:#d9d2c3;
  font-size:11px;
  line-height:1.35
}
.tiny{
  color:#aab9c4;
  font-size:10px
}
#overlay{
  position:fixed;
  inset:0;
  background:#070b11ed;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  padding:12px;
  overflow:auto
}
#overlay.hidden{
  display:none
}
.panel{
  width:min(520px,100%);
  background:#1c2731;
  border:1px solid #667786;
  border-radius:12px;
  padding:17px;
  max-height:94dvh;
  overflow:auto
}
.panel h1{
  margin:0 0 6px;
  color:#e9c18a;
  font-size:23px
}
.panel p{
  color:#b9c6cc;
  line-height:1.5
}
.classes{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px
}
.classes button{
  min-height:74px;
  text-align:left;
  padding:9px;
  font-size:14px
}
.classes small{
  display:block;
  color:#c4cdd1;
  font-size:11px;
  margin-top:5px
}
.panel .wide{
  width:100%;
  padding:11px;
  margin-top:10px;
  font-size:14px
}
#portrait{
  color:#e7b477
}
@media(max-height:430px){
  footer{
    min-height:138px
  }
  .pad{
    grid-template-columns:repeat(3,42px);
    grid-template-rows:repeat(3,38px)
  }
  .skills button,.tools button{
    min-height:26px
  }
  #log{
    height:24px
  }
}
@media(max-width:560px){
  .pad{
    grid-template-columns:repeat(3,40px);
    grid-template-rows:repeat(3,40px)
  }
  footer{
    gap:5px
  }
  .skills button,.tools button{
    font-size:10px
  }
}
@media(orientation:portrait){
  footer{
    min-height:210px;
    align-items:flex-end
  }
  .pad{
    grid-template-columns:repeat(3,45px);
    grid-template-rows:repeat(3,54px)
  }
  .right{
    gap:8px
  }
}
.panel{
  touch-action:pan-y
}
.panel select{
  background:#344453;
  color:#fff;
  padding:9px;
  border-radius:6px;
  width:100%;
  font-size:16px
}
.panel label{
  display:block;
  margin-top:12px
}
.pad{
  grid-template-columns:repeat(3,var(--padw,46px));
  grid-template-rows:repeat(3,var(--padh,43px))
}
main{
  overflow:hidden
}
canvas{
  object-fit:fill;
  flex:none
}
.gear-detail{
  display:block;
  font-size:11px;
  color:#d1d8df;
  margin-top:4px;
  line-height:1.4
}
.gear-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 64px;
  gap:6px;
  align-items:stretch
}
.gear-row .wide{
  text-align:left
}
.gear-row [data-drop]{
  text-align:center
}
.tools{
  grid-template-columns:repeat(3,minmax(0,1fr))
}
.tools button.active{
  outline:2px solid #e9bd76;
  background:#77583a
}
.tools button:disabled{
  opacity:.45
}
/* TECH-012C — Habillage du HUD, des commandes, des fenêtres et des retours de combat. */
/* GAME-007F */
header{
  height:auto;
  min-height:65px;
  flex:none;
  display:block;
  padding:5px 9px 6px;
  background:linear-gradient(#25282c,#14181d);
  border-bottom:1px solid #66583f
}
.hud-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px
}
header strong{
  color:#d8bb82;
  font-family:Georgia,serif;
  letter-spacing:.08em;
  font-size:14px
}
#biomeName{
  display:block;
  font:10px system-ui,sans-serif;
  letter-spacing:0
}
#stats{
  font-size:10px;
  max-width:56%;
  color:#e7ddc9
}
#hudMeters{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
  margin-top:4px
}
.hud-meter{
  min-width:0;
  font-size:10px;
  color:#e7ddc9;
  line-height:1.1
}
.meter-label{
  display:flex;
  justify-content:space-between;
  gap:3px;
  white-space:nowrap
}
.meter-label span:first-child{
  overflow:hidden;
  text-overflow:ellipsis
}
.meter-track{
  height:6px;
  margin-top:3px;
  background:#090c10;
  border:1px solid #4f493c;
  overflow:hidden
}
.meter-fill{
  display:block;
  height:100%;
  background:#a64c4b
}
.meter-res .meter-fill{
  background:#5189ac
}
.meter-xp .meter-fill{
  background:#c9a15e
}
main{
  position:relative;
  background:radial-gradient(ellipse,#191b1f,#090c10 75%)
}
footer{
  background:linear-gradient(#22252b,#12161b);
  border-top:1px solid #66583f
}
button{
  background:linear-gradient(#363a40,#24282e);
  border:1px solid #6b6252;
  border-radius:4px;
  color:#f0e5cf;
  box-shadow:inset 0 1px #ffffff10
}
button:active{
  background:#735b3d;
  box-shadow:inset 0 0 0 1px #d4b97d
}
button:focus-visible{
  outline:2px solid #f4d58e;
  outline-offset:1px
}
.pad{
  gap:3px;
  padding:3px;
  background:#101318;
  border:1px solid #514737;
  border-radius:6px
}
.pad button{
  color:#e0c58e;
  background:linear-gradient(#34383b,#22262a);
  font-size:23px
}
.pad #wait{
  background:#393025;
  color:#f0cb85
}
.skills button,.tools button{
  font-size:10px;
  line-height:1.2;
  min-width:0;
  overflow-wrap:anywhere
}
.skills button{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  min-height:45px
}
.skill-icon{
  width:16px;
  height:16px;
  flex:none;
  vertical-align:middle;
  shape-rendering:crispEdges
}
.skills button.active,.tools button.active{
  outline:2px solid #e6b86c;
  background:#51402c
}
button:disabled{
  opacity:.55
}
#log{
  color:#e0cdb1;
  background:#101318;
  border-left:2px solid #85704d;
  padding:2px 4px;
  height:35px
}
.panel{
  background:linear-gradient(#26282c,#171b20);
  border:1px solid #8b7551;
  border-radius:6px;
  box-shadow:0 0 0 3px #151719,0 10px 40px #0009
}
.panel h1{
  font-family:Georgia,serif;
  color:#e1bf83
}
.panel h2{
  color:#d3bb8c;
  font-size:16px;
  border-bottom:1px solid #5c503c;
  padding-bottom:4px
}
.panel p,.classes small{
  color:#d0c6b5
}
.panel select{
  background:#20252b;
  border:1px solid #8b7551;
  color:#eee2c9
}
.class-icon{
  width:32px;
  height:32px;
  vertical-align:middle;
  margin-right:6px;
  shape-rendering:crispEdges
}
#combatFx{
  pointer-events:none;
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden
}
.fx-chip{
  font-size:13px;
  font-weight:800;
  background:#17181eea;
  border:1px solid currentColor;
  padding:3px 7px;
  animation:rogue-fx .85s ease-out forwards
}
.fx-hit{
  color:#ffc28d
}
.fx-critical{
  color:#ffdc77
}
.fx-hurt{
  color:#ff9390
}
.fx-heal{
  color:#98e2ae
}
.fx-guard{
  color:#a4d8ff
}
@keyframes rogue-fx{
  0%{
    opacity:1;
    transform:translateY(6px)
  }
  60%{
    opacity:1
  }
  100%{
    opacity:0;
    transform:translateY(-18px)
  }
}
@media(prefers-reduced-motion:reduce){
  .fx-chip{
    animation-name:rogue-fx-reduced
  }
  @keyframes rogue-fx-reduced{
    0%,70%{
      opacity:1
    }
    100%{
      opacity:0
    }
  }
}
@media(max-height:430px){
  header{
    min-height:56px;
    padding:3px 7px
  }
  #hudMeters{
    margin-top:2px
  }
  .skills button{
    min-height:32px;
    flex-direction:row
  }
  .skill-icon{
    width:13px;
    height:13px
  }
  #log{
    height:24px
  }
  .pad{
    padding:1px
  }
}
@media(max-width:340px){
  footer{
    gap:3px;
    padding-left:4px;
    padding-right:4px
  }
  .pad{
    padding:1px
  }
  .right{
    gap:3px
  }
  .skills button,.tools button{
    font-size:9px
  }
}
/* TECH-012C — Écran titre : illustration, marque et actions principales. */
/* GAME-009A — original CRYPTGRAVE title screen, scoped to the main menu. */
.panel:has(.crypt-start){
  width:min(570px,100%);
  padding:0;
  border-color:#9c7b48;
  background:#131418;
  scrollbar-color:#725538 #171418
}
.crypt-start{
  isolation:isolate;
  color:#eee2ca
}
.crypt-hero{
  position:relative;
  overflow:hidden;
  aspect-ratio:16/10;
  min-height:176px;
  background:#380e19;
  border-bottom:1px solid #9c7b48
}
.crypt-hero svg{
  display:block;
  width:100%;
  height:100%;
  position:absolute;
  inset:0
}
.crypt-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,#08070c88 0%,transparent 44%,transparent 70%,#131418 100%);
  pointer-events:none
}
.crypt-brand{
  position:absolute;
  z-index:1;
  top:9%;
  left:3%;
  right:3%;
  text-align:center;
  pointer-events:none
}
.crypt-brand .crypt-kicker{
  font:700 9px system-ui,sans-serif;
  letter-spacing:.32em;
  color:#eed0a0;
  text-shadow:0 1px 4px #000
}
.crypt-start .crypt-brand h1{
  margin:3px 0 0;
  font:bold clamp(28px,8vw,53px)/1 Georgia,serif;
  letter-spacing:.025em;
  color:#f5d68b;
  text-shadow:0 2px #8d4c26,0 4px #341c16,2px 5px 6px #000,-1px -1px #fff0b3;
  -webkit-text-stroke:.35px #8a5b33
}
.crypt-rule{
  height:2px;
  width:76%;
  margin:7px auto 0;
  background:linear-gradient(90deg,transparent,#d4ac6c,transparent)
}
.crypt-content{
  padding:2px 14px 12px
}
.crypt-start .crypt-intro{
  margin:0 0 7px;
  text-align:center;
  color:#cdbda6;
  font:italic 12px Georgia,serif;
  letter-spacing:.045em
}
.crypt-actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px
}
.crypt-start button{
  min-width:0;
  min-height:40px;
  border-color:#80633d;
  background:linear-gradient(#33252a,#201b20);
  box-shadow:inset 0 1px #d5af6c18;
  color:#f0dfba
}
.crypt-start button:active{
  background:#70412e
}
.crypt-start .wide{
  margin:0;
  padding:8px 5px;
  font-size:12px;
  font-weight:600
}
.crypt-start #resume{
  grid-column:1/-1;
  min-height:44px;
  color:#1d1410;
  background:linear-gradient(#e4c387,#ad7e42);
  border-color:#e9ca90;
  text-shadow:0 1px #f6de9d;
  font-family:Georgia,serif;
  font-size:16px
}
.crypt-start #resume:active{
  background:#b58a54
}
.crypt-start h2{
  font:700 15px Georgia,serif;
  margin:10px 0 6px;
  text-align:center;
  letter-spacing:.06em;
  border-bottom:1px solid #5c4936
}
.crypt-start .classes{
  gap:5px
}
.crypt-start .classes button{
  min-height:59px;
  padding:5px 6px;
  display:grid;
  grid-template-columns:32px 1fr;
  align-items:center;
  column-gap:5px;
  font-size:13px;
  text-align:left
}
.crypt-start .classes .class-icon{
  grid-row:span 2;
  margin:0
}
.crypt-start .classes small{
  grid-column:2;
  margin:0;
  color:#c5b49b;
  font-size:10px;
  line-height:1.3
}
.crypt-start .crypt-foot{
  margin:7px 0 0;
  font-size:10px;
  color:#bfb09b;
  text-align:center
}
@media(max-width:340px){
  .crypt-content{
    padding:2px 9px 10px
  }
  .crypt-hero{
    min-height:154px
  }
  .crypt-start .wide{
    font-size:11px
  }
  .crypt-start .classes button{
    font-size:12px;
    grid-template-columns:27px 1fr
  }
  .crypt-start .classes .class-icon{
    width:27px;
    height:27px
  }
}
@media(orientation:landscape) and (max-height:600px){
  .panel:has(.crypt-start){
    width:min(820px,100%)
  }
  .crypt-start{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:stretch
  }
  .crypt-hero{
    aspect-ratio:auto;
    min-height:0;
    border-bottom:0;
    border-right:1px solid #9c7b48
  }
  .crypt-hero svg{
    width:100%;
    height:100%
  }
  .crypt-brand{
    top:12%
  }
  .crypt-start .crypt-brand h1{
    font-size:clamp(24px,5vw,44px)
  }
  .crypt-content{
    padding:10px
  }
  .crypt-start .classes button{
    min-height:53px
  }
  .crypt-start h2{
    margin-top:8px
  }
  .crypt-start .wide{
    min-height:35px
  }
}
/* TECH-012C — Cartes de classes : portraits et statistiques de départ. */
/* GAME-009B: class cards; scoped to the title screen. */
.crypt-start .classes{
  gap:6px
}
.crypt-start .classes .crypt-class-card{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:3px;
  padding:5px;
  min-height:0;
  text-align:left;
  position:relative;
  overflow:hidden;
  background:linear-gradient(160deg,#32292d,#19191e)
}
.crypt-start .crypt-class-card .class-portrait{
  width:100%;
  height:clamp(60px,21vw,105px);
  display:block;
  object-fit:contain;
  border:1px solid #826740;
  background:#17181d
}
.crypt-start .crypt-class-head{
  display:flex;
  align-items:center;
  gap:3px;
  font:700 14px Georgia,serif;
  color:#eed09b
}
.crypt-start .crypt-class-head .class-icon{
  width:20px;
  height:20px;
  margin:0
}
.crypt-start .crypt-class-role{
  font:italic 11px Georgia,serif;
  color:#dbb98b
}
.crypt-start .crypt-class-card small{
  font-size:10px;
  line-height:1.25;
  min-height:25px;
  color:#cdbfaa
}
.crypt-class-stats{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  font-size:10px;
  line-height:1.2
}
.crypt-class-stats span{
  background:#26303a;
  border:1px solid #495968;
  padding:2px 3px;
  color:#cce0ec
}
.crypt-class-stats .crypt-class-hp{
  background:#3b2328;
  border-color:#74474a;
  color:#f2b2ac
}
.crypt-class-spec{
  font-size:9px;
  color:#d4c09c;
  border-top:1px solid #6a533d;
  padding-top:3px;
  line-height:1.25
}
.crypt-start .class-warrior{
  border-top-color:#aebac3
}
.crypt-start .class-rogue{
  border-top-color:#bf9f85
}
.crypt-start .class-ranger{
  border-top-color:#b8ba81
}
.crypt-start .class-mage{
  border-top-color:#beadd9
}
@media(orientation:landscape) and (max-height:600px){
  .crypt-start .classes .crypt-class-card .class-portrait{
    height:60px
  }
  .crypt-start .crypt-class-card small{
    min-height:0
  }
}
/* TECH-012C — Fiche du personnage : statistiques, jauges et progression. */
/* GAME-009C — character dossier, scoped to inventory view. */
.panel:has(.crypt-sheet){
  width:min(650px,100%);
  border-color:#987548;
  padding:12px;
  background:linear-gradient(150deg,#30272a,#17181d 45%,#15161a);
  scrollbar-color:#856940 #19181c
}
.crypt-sheet{
  color:#e9dbc3;
  border:1px solid #80633d;
  background:linear-gradient(140deg,#302a2a,#181a20);
  padding:9px;
  position:relative;
  box-shadow:inset 0 0 0 3px #131419
}
.crypt-sheet .sheet-kicker{
  font:700 9px system-ui,sans-serif;
  letter-spacing:.18em;
  text-align:center;
  color:#c2a374;
  margin:0 0 7px
}
.crypt-sheet .sheet-top{
  display:grid;
  grid-template-columns:minmax(68px,100px) minmax(0,1fr);
  gap:10px;
  align-items:center
}
.crypt-sheet .sheet-art{
  border:1px solid #8c724c;
  background:#191b22;
  position:relative;
  padding:3px
}
.crypt-sheet .class-portrait{
  display:block;
  width:100%;
  height:auto
}
.crypt-sheet .sheet-sprite{
  position:absolute;
  right:3px;
  bottom:3px;
  width:34px;
  height:34px;
  background:#13171e;
  border:1px solid #977b54;
  shape-rendering:crispEdges
}
.crypt-sheet h1{
  font:700 25px/1.15 Georgia,serif;
  margin:0 0 3px;
  color:#f0d096
}
.crypt-sheet .sheet-spec{
  font:italic 12px Georgia,serif;
  color:#d0b58d;
  margin:0 0 4px
}
.crypt-sheet .sheet-meta{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  font-size:11px;
  margin:4px 0
}
.crypt-sheet .sheet-meta span{
  border:1px solid #5e4f40;
  padding:3px 5px;
  background:#17191f;
  color:#dec8a3
}
.crypt-sheet .sheet-meta .sheet-gold{
  color:#edc77d
}
.crypt-sheet .sheet-meters{
  display:grid;
  gap:4px;
  margin-top:8px
}
.crypt-sheet .sheet-meter-label{
  display:flex;
  justify-content:space-between;
  gap:8px;

<script>
(()=>{'use strict';
/* TECH-012C — Dimensions de la grille logique (W, H), taille native des sprites (T) et références DOM. KEY est une clé historique : la renommer empêcherait de retrouver les sauvegardes existantes. */
const W=48,H=32,T=16,VIEWW=40,VIEWH=24,KEY='rogue-android-game002-v1',canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),log=document.getElementById('log'),stats=document.getElementById('stats'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel');
/* TECH-012C — Catalogue des quatre classes. Chaque compétence est décrite par [nom, coût en ressource, recharge en tours, mode de ciblage]. */
const CLASSES={warrior:{name:'Guerrier',desc:'Robuste · parade et frappe',hp:28,res:'Endurance',maxRes:12,color:'#a5c8ce',skills:[['Frappe',3,3,'direction'],['Souffle',4,6,'heal'],['Garde',2,5,'guard']]},rogue:{name:'Voleur',desc:'Rapide · critique et esquive',hp:21,res:'Énergie',maxRes:14,color:'#b8c49a',skills:[['Estoc',3,3,'direction'],['Esquive',3,5,'guard'],['Focus',2,5,'boost']]},ranger:{name:'Rôdeur',desc:'Précis · tirs et survie',hp:23,res:'Concentration',maxRes:12,color:'#d2bd88',skills:[['Tir',3,3,'ranged'],['Soin',4,6,'heal'],['Visée',2,5,'boost']]},mage:{name:'Arcaniste',desc:'Fragile · magie à distance',hp:18,res:'Mana',maxRes:16,color:'#b4a8db',skills:[['Éclair',4,3,'ranged'],['Soin',5,6,'heal'],['Barrière',3,5,'guard']]}};
const ADV={warrior:[['Brise-garde',5,5,'direction'],['Bastion',5,8,'guard']],rogue:[['Exécution',6,5,'direction'],['Disparition',4,8,'guard']],ranger:[['Tir perforant',5,5,'ranged'],['Second souffle',5,8,'heal']],mage:[['Décharge',6,5,'ranged'],['Égide',5,8,'guard']]};for(const k of Object.keys(ADV))CLASSES[k].skills.push(...ADV[k]);const unlocked=i=>i<3||!!S.activeTalents[i];const PREF='rogue-android-display-v1';let prefs={zoom:100,pad:100};try{const p=JSON.parse(localStorage.getItem(PREF));if(p){if([75,100,125,150,200].includes(p.zoom))prefs.zoom=p.zoom;if([85,100,115].includes(p.pad))prefs.pad=p.pad}}catch(e){};
/* TECH-012A — Applique les préférences d'affichage et de commandes tactiles, puis recalcule la taille de la carte. L'échec du stockage des préférences ne doit pas bloquer le jeu. */

/* TECH-012A — Dimensionne le canvas par cases entières à partir de l'espace disponible et du zoom. Ne réalloue le canvas que si sa taille change, pour limiter le coût du rendu. */
function resizeMap(){const m=canvas.parentElement;const w=Math.max(16,m.clientWidth-6),h=Math.max(16,m.clientHeight-6);const scale= Math.max(1,Math.floor(Math.min(w/40,h/24)/16*16));const tile=Math.max(1,Math.round(scale*prefs.zoom/100));const cw=Math.max(1,Math.floor(w/tile))*T,ch=Math.max(1,Math.floor(h/tile))*T;if(canvas.width!==cw)canvas.width=cw;if(canvas.height!==ch)canvas.height=ch;const sw=(cw/T*tile)+'px',sh=(ch/T*tile)+'px';if(canvas.style.width!==sw)canvas.style.width=sw;if(canvas.style.height!==sh)canvas.style.height=sh;render()}
/* TECH-012C — Présente le zoom, la taille du pavé et le plein écran ; le rappel back retourne à l'écran précédent. */

      localStorage.setItem(KEY,JSON.stringify({S,map,seen,monsters,loot,stairs,features,terrain}))

/* TECH-012A — Vérifie les données persistées avant de restaurer le donjon et le personnage. Retourne false si la sauvegarde est absente ou invalide, puis applique la migration si elle est valide. */

    let d=JSON.parse(localStorage.getItem(KEY));
    if(!d||!Object.hasOwn(CLASSES,d.S?.classId)||d.S.dead||d.S.ended||
       d.map.length!==W*H||d.seen.length!==W*H||
       !Array.isArray(d.monsters)||!Array.isArray(d.loot)||!d.stairs)return false;

     new Set(S.bar).size!==3||
     S.bar.some(i=>!Number.isInteger(i)||i<0||i>4||!unlocked(i)))S.bar=[0,1,2];
  while(S.cool.length<5)S.cool.push(0);

  S.equip.boots??=null;

  S.serial=Math.max(S.serial,

    ...Object.values(S.equip).map(i=>i?.id||0),

function doctrineDescription(id,spec){return DOCTRINES[id]?.[spec]||''}
function doctrineBonus(s,kind,target=null,profile=null){
 if(!s||s.level<5||!doctrineDescription(s.classId,s.spec))return 0;
 const low=s.hp*2<=s.maxHp;
 if(s.spec==='offense'&&kind==='damage'){
  if(s.classId==='warrior'&&!profile?.ranged&&low)return 2;
  if(s.classId==='rogue'&&!profile?.ranged&&target?.bleed>0)return 2;
  if(s.classId==='ranger'&&profile?.ranged&&Number.isFinite(target?.x)&&Number.isFinite(target?.y)&&dist(s,target)>=3)return 2;
  if(s.classId==='mage'&&profile?.skill&&s.res*2<=s.maxRes)return 2;
 }
 if(s.spec==='defense'){
  if(kind==='def'&&((s.classId==='warrior'&&s.guard>0)||(s.classId==='ranger'&&low)||(s.classId==='mage'&&s.shield>0)))return 2;
  if(kind==='dodge'&&s.classId==='rogue'&&s.guard>0)return 5;
 }

}
/* TECH-012C — Seuils de rendement décroissant et plafonds des probabilités de critique, d'esquive et de régénération. */
const BALANCE={critSoft:35,critMax:50,dodgeSoft:25,dodgeMax:35,regenMax:4};
/* TECH-012C — Au-delà du seuil souple, chaque tranche de trois points bruts apporte un point de probabilité, dans la limite du plafond. */
function diminishingChance(raw,soft,max){return Math.max(0,Math.min(max,raw<=soft?raw:soft+Math.floor((raw-soft)/3)))}
/* TECH-012C — Calcule la probabilité de critique en combinant perception, équipement, classe, profil d'attaque et talents. */
function criticalChance(profile=null){return diminishingChance(3+S.attrs[5]*2+bonus('crit')+(profile?.crit||0)+(S.classId==='rogue'?5:0)+(S.nodes.o2?8:0)+talentBonus('crit'),BALANCE.critSoft,BALANCE.critMax)}
/* TECH-012C — Calcule la probabilité d'esquive en combinant dextérité, équipement, talents et spécialisation. */
function dodgeChance(){return diminishingChance(S.attrs[1]+bonus('dodge')+talentBonus('dodge')+(S.nodes.d2?5:0)+(S.spec==='defense'?5:0)+doctrineBonus(S,'dodge'),BALANCE.dodgeSoft,BALANCE.dodgeMax)}
/* TECH-012C — Sélectionne l'attribut offensif approprié à la compétence ou à l'arme ; la lance utilise le meilleur de Force et Dextérité. */
function attackAttribute(profile=null){
 const fallback=S.classId==='mage'?4:S.classId==='warrior'?0:1;
 if(profile?.skill)return S.attrs[fallback];
 const family=weaponFamily(S.equip.weapon);
 if(family==='spear')return Math.max(S.attrs[0],S.attrs[1]);
 const index={blade:0,axe:0,mace:0,dagger:1,bow:1,staff:4}[family];
 return S.attrs[index??fallback];
}
/* TECH-012A — Calcule les dégâts du joueur en combinant arme, attribut, équipement, talents et effets contextuels. Applique ensuite le critique puis la protection de l'affixe armored. */
function outgoingDamage(m,damage,profile=null,critical=false){
 let d=Math.max(1,damage+(profile?.power||0)+S.atk+bonus('atk')+Math.floor(attackAttribute(profile)/4)+(S.boost>0?3:0));
 if(S.spec==='offense')d+=2;
 if(m.exposed>0)d+=2;
 if(S.nodes.o1)d++;
 if(S.nodes.master)d+=2;
 d+=talentBonus(profile?.skill?'skill':'basic')+(profile?.ranged?talentBonus('ranged'):0)+(m.hp*2<=m.maxHp?talentBonus('lowHp'):0);
 d+=doctrineBonus(S,'damage',m,profile)+synergyDamage(m,profile);
 /* TECH-012C — Le critique multiplie les dégâts par 1,5 avant la réduction de l'affixe blindé. */
 if(critical)d=Math.ceil(d*1.5);
 if(m.affix==='armored')d=Math.max(1,d-Math.max(0,2-(profile?.pierce||0)));

}
/* TECH-012A — Calcule les dégâts subis après réduction défensive. À partir de l'étage 7, une fraction minimale des dégâts bruts empêche l'armure de neutraliser totalement les attaques. */
function incomingDamage(m,power=0,variance=0){
 const raw=m.atk+power+(m.affix==='furious'&&m.hp*2<=m.maxHp?2:0)+variance;
 const reduction=S.armor+bonus('def')+currentStyle().def+
   talentBonus('def')+Math.floor(S.attrs[2]/6)+(S.guard>0?2:0)+
   (S.spec==='defense'?1:0)+(S.nodes.d1?1:0)+doctrineBonus(S,'def');
 // Above early floors, armor alone cannot nullify heavy strikes; shields still absorb damage.
 const minimum=S.floor>=7?Math.ceil(raw*(m.boss||m.elite?0.30:0.20)):1;
 return Math.max(1,minimum,raw-reduction);
}
/* TECH-012C — Régénération par tour : les attaques à distance payantes et compétences offensives ont des plafonds propres. */
function resourceRegen(rangedWeapon=false,offensiveSkill=false){
 if(rangedWeapon)return 1;
 return Math.min(offensiveSkill?2:BALANCE.regenMax,1+(S.classId==='rogue'&&S.turn%2===0?1:0)+Math.min(2,Math.floor(S.attrs[3]/12))+Math.min(2,bonus('regen'))+(S.nodes.master?1:0));
}

// GAME-006F: local hall of fame; independent from the active run save.
const HISTORY_KEY='rogue-android-history-v1',FINAL_FLOOR=30,HISTORY_LIMIT=50;

function emptyHistory(){return {version:1,runs:[],total:0,wins:0,deaths:0,abandoned:0,bestScore:0,bestFloor:0,bestKills:0,fastestWin:null,classWins:{warrior:0,rogue:0,ranger:0,mage:0},challenges:[]}}

   for(const k of ['total','wins','deaths','abandoned','bestScore','bestFloor','bestKills'])h[k]=historyNumber(raw[k]);
   h.fastestWin=Number.isFinite(raw.fastestWin)&&raw.fastestWin>=0?historyNumber(raw.fastestWin):null;
   for(const k of Object.keys(h.classWins))h.classWins[k]=historyNumber(raw.classWins?.[k]);
   h.challenges=Array.isArray(raw.challenges)?raw.challenges.filter(x=>['first-win','swift','collector','all-classes'].includes(x)):[];

/* TECH-012C — Calcule le score final et compte les reliques de boss distinctes dans le sac et l'équipement. */

/* TECH-012A — Ajoute le bilan au journal des parties, limite la liste récente et actualise les statistiques cumulées et les défis débloqués. */
function recordRun(r){

 h.runs.unshift(r);
 h.runs=h.runs.slice(0,HISTORY_LIMIT);
 h.total++;
 if(r.outcome==='victory'){h.wins++;h.classWins[r.classId]++;h.fastestWin=h.fastestWin===null?r.turns:Math.min(h.fastestWin,r.turns)}

/* TECH-012C — Centralise la fin de partie et empêche de la comptabiliser deux fois. La victoire exige la sortie finale accessible, le joueur vivant et les boss vaincus. */
function endRun(outcome){

/* GAME-008E3: explicit, portable local transfer; no automatic checkpoints. */
/* TECH-012C — Limite la taille du texte importé à 524 288 unités de chaîne et identifie le format de transfert versionné. */
const TRANSFER_LIMIT=524288,TRANSFER_FORMAT='cryptgrave-transfer-v1';
const transferObject=v=>v!==null&&typeof v==='object'&&!Array.isArray(v)&&Object.getPrototypeOf(v)===Object.prototype;

function transferTree(v,depth=0,budget={n:0}){
 transferAssert(depth<=16&&++budget.n<=40000);
 if(v===null||typeof v==='boolean')return;
 if(typeof v==='number'){transferAssert(Number.isFinite(v)&&Math.abs(v)<=4294967296);return}
 if(typeof v==='string'){transferAssert(v.length<=256&&!/[<>&"`\\\u0000-\u001f]/.test(v));return}

 transferAssert(keys.length<=128);

}

function transferPoint(p){return transferObject(p)&&transferInt(p.x,0,W-1)&&transferInt(p.y,0,H-1)}

function transferGear(it){

}

function validateTransferRun(d){

 transferAssert(Object.hasOwn(CLASSES,s.classId)&&s.dead===false&&!s.ended&&transferPoint(s)&&transferPoint(d.stairs));

 for(const slot of ['weapon','armor','helmet','boots','ring']){const it=s.equip[slot];if(it!==null){transferGear(it);transferAssert(it.slot===slot)}}
 for(const k of ['map','seen'])transferAssert(Array.isArray(d[k])&&d[k].length===W*H&&d[k].every(v=>v===0||v===1));
 transferAssert(d.map[s.y*W+s.x]===0&&d.map[d.stairs.y*W+d.stairs.x]===0);

function populateBestiary(all,biome,floor,seed){
 if(floor<4||!Object.hasOwn(BESTIARY,biome))return all;

   if(m.boss||m.elite||m.rare||rnd(100)>=55)return m;
   const [species,kind,color,role,skill]=BESTIARY[biome][rnd(2)];
   const hp=5+Math.floor(depth/2)+bonus+(role==='brute'?4:role==='tracker'?1:0);
   return {...m,species,kind,color,role,creatureSkill:skill,creatureCD:0,hp,maxHp:hp,atk:2+bonus+(role==='brute'?1:0)};
 });
}

 if(m.creatureCD>0){m.creatureCD--;return null}
 if(distance(m,player)>skill.range||!ray(m,player))return null;
 const cells=[{x:player.x,y:player.y}];
 if(m.creatureSkill==='burst')for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const p={x:player.x+dx,y:player.y+dy};
   if(!same(m,p)&&board.stepOK(p.x,p.y,player.x,player.y)&&ray(m,p))cells.push(p);

// GAME-006D: deterministic merchants, optional gold field for legacy saves.
const MERCHANTS={
 arms:{name:'Armurier itinérant',color:'#d2a66c',slots:['weapon','armor','helmet'],goods:['heal','guard']},
 apothecary:{name:'Apothicaire',color:'#82c7a1',slots:['ring','boots'],goods:['heal','focus','guard','power','ward']},
 trader:{name:'Colporteur',color:'#b7a3d9',slots:['weapon','ring','boots'],goods:['insight','smoke','toolkit','heal']}
};
const GOLD_CAP=99999;
function goldBalance(){return Math.max(0,Math.min(GOLD_CAP,Math.floor(Number(S?.gold)||0)))}
/* TECH-012C — Récompense en or proportionnelle à la profondeur et au type de l'ennemi. */
function goldReward(m,floor){const depth=Math.max(1,Math.min(30,floor));return m.boss?25+depth:m.rare?15+Math.floor(depth/2):m.elite?8+Math.floor(depth/3):2+Math.floor(depth/5)}
/* TECH-012C — Prix d'achat calculé à partir du niveau de l'objet, de sa rareté et d'une majoration après le niveau 15. */
function gearPrice(it){const depth=Math.max(1,Math.min(30,Math.floor(Number(it.itemLevel)||1))),rarity=rarityOf(it);return 12+depth*2+[0,9,23,48,95][rarity-1]+Math.max(0,depth-15)}
/* TECH-012C — La revente rapporte 40 % du prix d'achat, arrondis à l'entier inférieur avec un minimum de 1. */
function salePrice(it){return Math.max(1,Math.floor(gearPrice(it)*0.4))}
/* TECH-012C — Génère un stock déterministe par étage, graine et marchand, sans attribuer les identifiants des futurs objets achetés. */
function merchantStock(floor,seed,merchantId){
 const v=MERCHANTS[merchantId];if(!v)return [];
 let n=(seed^Math.imul(floor,0x9e3779b1)^0x26d08fa9)>>>0;
 const rnd=k=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return Math.floor(n/4294967296*k)};
 const stock=[],slots=Object.keys(GEAR_SLOTS),depth=Math.max(1,Math.min(30,floor));
 for(let i=0;i<(merchantId==='apothecary'?2:3);i++){
   const slot=v.slots[rnd(v.slots.length)];let first=true;
   const rarity=1+Number(depth>=5&&rnd(100)<70)+Number(depth>=10&&rnd(100)<45)+Number(depth>=20&&rnd(100)<25);
   const item=createGear(0,depth,1,k=>{if(first){first=false;return slots.indexOf(slot)}return rnd(k)},rarity);
   delete item.id;stock.push({kind:'gear',item,price:gearPrice(item),qty:1});
 }
 for(const id of v.goods.filter(id=>CONSUMABLES[id].min<=depth))stock.push({kind:'consumable',id,price:8+Math.floor(depth/3)+(['guard','power','ward'].includes(id)?4:0),qty:merchantId==='apothecary'?2:1});
 stock.push({kind:'bandage',price:5+Math.floor(depth/5),qty:2});
 return stock;
}
/* TECH-012C — Place un marchand tous les trois étages à partir du deuxième, près du départ, sans occuper les positions déjà réservées. */
function buildMerchant(d,decorated,terrain,loot,all,floor,W,H){
 if(floor<2||floor>30||(floor-2)%3!==0)return null;
 const used=new Set([d.start,d.stairs,...all,...loot,...decorated.features,...terrain].map(p=>p.y*W+p.x)),candidates=[];
 for(let y=d.start.y-5;y<=d.start.y+5;y++)for(let x=d.start.x-5;x<=d.start.x+5;x++){
   if(x<2||y<2||x>=W-2||y>=H-2||used.has(y*W+x)||Math.max(Math.abs(x-d.start.x),Math.abs(y-d.start.y))>5)continue;
   // Full open neighborhood prevents a non-walkable shop from blocking corridors.
   let open=true;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(decorated.map[(y+dy)*W+x+dx]!==0)open=false;
   if(open)candidates.push({x,y});
 }
 if(!candidates.length)return null;
 const n=(d.seed^Math.imul(floor,0x85ebca6b))>>>0,merchantId=['arms','apothecary','trader'][Math.floor((floor-2)/3)%3],p=candidates[n%candidates.length];
 return {...p,type:'merchant',merchantId,found:true,stock:merchantStock(floor,d.seed,merchantId)};
}
/* TECH-012C — Le commerce exige un marchand adjacent et accessible, ainsi qu'une zone sans ennemi vivant à six cases ou moins. */
function merchantAvailable(f){
 return mode==='game'&&S&&!S.dead&&f?.type==='merchant'&&Object.hasOwn(MERCHANTS,f.merchantId)&&features.includes(f)&&dist(f,S)===1&&stepOK(f.x,f.y,S.x,S.y)&&!mob(f.x,f.y)&&!monsters.some(m=>m.hp>0&&dist(m,S)<=6);
}
/* TECH-012C — Contrôle le stock, le prix, l'or et la capacité de rangement avant toute transaction. */
function canBuy(f,index){
 if(!merchantAvailable(f)||!Number.isInteger(index))return false;
 const a=f.stock?.[index];if(!a||!Number.isInteger(a.qty)||a.qty<=0||!Number.isInteger(a.price)||a.price<=0||goldBalance()<a.price)return false;
 if(a.kind==='gear')return S.bag.length<24&&!!a.item&&Object.hasOwn(GEAR_SLOTS,a.item.slot);
 if(a.kind==='consumable')return Object.hasOwn(CONSUMABLES,a.id)&&pouchCount(a.id)<POUCH_CAP;
 return a.kind==='bandage';
}
/* TECH-012C — Vérifie l'achat, ajoute la marchandise, débite l'or et réduit le stock. Un équipement acheté reçoit un nouvel identifiant. */
function buyMerchant(f,index){
 if(!canBuy(f,index))return false;
 const a=f.stock[index];
 if(a.kind==='gear')S.bag.push({...a.item,id:++S.serial});
 else if(a.kind==='consumable'){if(!addConsumable(a.id))return false}
 else S.bandages++;
 S.gold=goldBalance()-a.price;
 a.qty--;
 say('Achat : -'+a.price+' or.');
 save();
 update();
 return true;
}
/* TECH-012C — Exclut les reliques de boss et les ventes qui dépasseraient le plafond d'or. */
function canSell(f,id){
 if(!merchantAvailable(f)||!Number.isInteger(id))return false;
 const it=S.bag.find(v=>v.id===id);
 return !!it&&!it.bossRelic&&goldBalance()+salePrice(it)<=GOLD_CAP;
}
/* TECH-012C — Vend uniquement un objet admissible du sac, le retire et crédite son prix de revente. */
function sellMerchant(f,id){
 if(!canSell(f,id))return false;
 const i=S.bag.findIndex(v=>v.id===id),it=S.bag[i],price=salePrice(it);
 S.bag.splice(i,1);
 S.gold=goldBalance()+price;
 say('Vente : +'+price+' or.');
 save();
 update();
 return true;
}
function merchantMenu(f,tab='buy'){
 if(!merchantAvailable(f)){say('Commerce indisponible : éloigne les ennemis.');return}
 selected=null;
 const title=MERCHANTS[f.merchantId].name;
 const body=tab==='buy'?f.stock.map((a,i)=>'<button class="wide" data-buy="'+i+'" '+(canBuy(f,i)?'':'disabled')+'>'+(a.kind==='gear'?gearLabel(a.item):a.kind==='bandage'?'Bandage':escapeGear(CONSUMABLES[a.id].name))+' · '+a.price+' or · stock '+a.qty+'</button>').join(''):
 S.bag.map(it=>'<button class="wide" data-sell="'+it.id+'" '+(canSell(f,it.id)?'':'disabled')+'>'+gearLabel(it)+' · '+(it.bossRelic?'Relique invendable':salePrice(it)+' or')+'</button>').join('')||'<p>Sac vide.</p>';
 show('<h1>'+title+'</h1><p>Or : <b>'+goldBalance()+'</b> · Sac '+S.bag.length+'/24</p><div class="classes"><button id="shopBuy" '+(tab==='buy'?'disabled':'')+'>Acheter</button><button id="shopSell" '+(tab==='sell'?'disabled':'')+'>Vendre</button></div>'+body+'<button class="wide" id="shopBack">Retour au donjon</button>');
 document.getElementById('shopBuy').onclick=()=>merchantMenu(f,'buy');document.getElementById('shopSell').onclick=()=>merchantMenu(f,'sell');document.getElementById('shopBack').onclick=hide;
 panel.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{buyMerchant(f,+b.dataset.buy);merchantMenu(f,'buy')});
 panel.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{sellMerchant(f,+b.dataset.sell);merchantMenu(f,'sell')});
}
// GAME-006E: special room sites and optional upgrades to existing hidden chambers.
const SPECIAL_ROOMS={
 sanctuary:{name:'Sanctuaire de repos',color:'#82c7a1',min:4,desc:'Un autel intact offre un bref répit.',choices:[['rest','Récupérer jusqu’à 14 PV et 6 ressources.'],['protect','Obtenir un bouclier de 12 points.']]},
 library:{name:'Bibliothèque ancienne',color:'#aab4e7',min:4,desc:'Des manuscrits ont survécu à la ruine.',choices:[['study','Étudier : gagner de l’expérience.'],['scroll','Prendre un parchemin de détection et un de protection.']]},
 vault:{name:'Salle du trésor',color:'#e5bc6a',min:5,desc:'Un coffre scellé renferme les richesses de cet étage.',choices:[['gold','Prendre de l’or.'],['gear','Prendre un équipement rare ou mieux.']]},
 cursed:{name:'Chambre maudite',color:'#c485ae',min:7,desc:'Le sceau exige un prix en sang, mais il peut être dissipé.',choices:[['blood','Sacrifier 8 PV : obtenir un équipement épique ou mieux.'],['purify','Dépenser 4 ressources : obtenir un bouclier de 10 points.']]},
 hidden:{name:'Reliquaire secret',color:'#8cc8d7',min:4,desc:'Une cache oubliée, dissimulée derrière un passage secret.',choices:[['relic','Prendre un équipement rare ou mieux.'],['supplies','Prendre 2 bandages et une potion de soin.']]},
 shrineTrial:{name:'Sanctuaire du serment',color:'#b9b6dc',min:8,desc:'Deux serments s’offrent à vous. L’un soigne, l’autre protège.',choices:[['oathHeal','Offrir 2 bandages : restaurer jusqu’à 24 PV et 8 ressources.'],['oathWard','Offrir 15 or : obtenir un bouclier de 20 points.']]},
 hiddenArchive:{name:'Archives scellées',color:'#a7b4df',min:8,secret:true,desc:'Derrière les murs, les dernières chroniques du royaume.',choices:[['archiveStudy','Gagner 20 + 2 × étage XP.'],['archiveScroll','Prendre un parchemin de détection et un de protection.']]},
 hiddenTreasury:{name:'Trésor des disparus',color:'#d5b780',min:12,secret:true,desc:'Les bijoux des disparus reposent dans une chambre oubliée.',choices:[['treasuryGold','Prendre 25 + 2 × étage or.'],['treasuryGear','Prendre un équipement épique ou mieux.']]}
};
/* TECH-012C — Génère des salles spéciales dans les étages admissibles à partir d'un flux pseudo-aléatoire local ; exclut les positions déjà occupées. */
function buildSpecialRooms(d,decorated,terrain,loot,all,floor,W,H){
 if(floor<4||floor>30)return [];
 let n=(d.seed^Math.imul(floor,0x9e3779b1)^0xb2c137ad)>>>0;n=Math.imul(n^(n>>>16),0x7feb352d);n=Math.imul(n^(n>>>15),0x846ca68b);n=(n^(n>>>16))>>>0;
 const rnd=k=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return Math.floor(n/4294967296*k)};
 const result=[],used=new Set([d.start,d.stairs,...all,...loot,...decorated.features,...terrain].map(p=>p.y*W+p.x));
 const contains=(r,p)=>p.x>=r.x&&p.x<r.x+r.w&&p.y>=r.y&&p.y<r.y+r.h;
 const candidates=[];
 for(const r of d.rooms){
   if(contains(r,d.start)||contains(r,d.stairs))continue;
   const cells=[];
   for(let y=r.y+1;y<r.y+r.h-1;y++)for(let x=r.x+1;x<r.x+r.w-1;x++){
     if(x<2||y<2||x>=W-2||y>=H-2||used.has(y*W+x)||Math.max(Math.abs(x-d.start.x),Math.abs(y-d.start.y))<=6)continue;
     let open=true;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(decorated.map[(y+dy)*W+x+dx]!==0)open=false;
     if(open)cells.push({x,y});
   }
   if(cells.length)candidates.push({r,cells});
 }
 const types=Object.keys(SPECIAL_ROOMS).filter(k=>k!=='hidden'&&!SPECIAL_ROOMS[k].secret&&floor>=SPECIAL_ROOMS[k].min);
 if(candidates.length&&rnd(100)<80){
   const {r,cells}=candidates[rnd(candidates.length)],p=cells[rnd(cells.length)];
   result.push({...p,type:'specialRoom',roomId:types[rnd(types.length)],found:true,spent:false,room:{x:r.x,y:r.y,w:r.w,h:r.h}});
 }
 const secretTypes=['hidden',...Object.keys(SPECIAL_ROOMS).filter(k=>SPECIAL_ROOMS[k].secret&&floor>=SPECIAL_ROOMS[k].min)];
 for(const secret of decorated.features.filter(f=>f.type==='chest'&&f.secret&&!f.open)){
  if(rnd(100)<65)result.push({x:secret.x,y:secret.y,type:'specialRoom',roomId:secretTypes[rnd(secretTypes.length)],found:true,spent:false,secret:true,room:{x:secret.x-1,y:secret.y-1,w:3,h:3}});
 }
 return result;
}
function specialRoomAllowed(f,choice){
 if(mode!=='game'||!S||S.dead||f?.type!=='specialRoom'||f.spent||!features.includes(f)||!Object.hasOwn(SPECIAL_ROOMS,f.roomId)||dist(f,S)!==1||!stepOK(f.x,f.y,S.x,S.y)||mob(f.x,f.y))return false;
 if(!SPECIAL_ROOMS[f.roomId].choices.some(c=>c[0]===choice))return false;
 if(choice==='rest')return S.hp<S.maxHp||S.res<S.maxRes;
 if(choice==='protect')return S.shield<12;
 if(choice==='study')return S.level<30;
 if(choice==='scroll')return pouchCount('insight')<POUCH_CAP&&pouchCount('ward')<POUCH_CAP;
 if(choice==='gold')return goldBalance()<GOLD_CAP;
 if(choice==='gear'||choice==='relic')return S.bag.length<24;
 if(choice==='blood')return S.hp>8&&S.bag.length<24;
 if(choice==='purify')return S.res>=4&&S.shield<10;
 if(choice==='supplies')return pouchCount('heal')<POUCH_CAP;
 if(choice==='oathHeal')return S.bandages>=2&&(S.hp<S.maxHp||S.res<S.maxRes);
 if(choice==='oathWard')return goldBalance()>=15&&S.shield<20;
 if(choice==='archiveStudy')return S.level<30;
 if(choice==='archiveScroll')return pouchCount('insight')<POUCH_CAP&&pouchCount('ward')<POUCH_CAP;
 if(choice==='treasuryGold')return goldBalance()<GOLD_CAP;
 if(choice==='treasuryGear')return S.bag.length<24;
 return false;
}
/* TECH-012C — Valide le choix, marque la salle comme utilisée et applique sa récompense. La salle conserve le choix effectué. */
function resolveSpecialRoom(f,choice){
 if(!specialRoomAllowed(f,choice))return false;
 const floor=Math.max(1,Math.min(30,S.floor));
 f.spent=true;f.choice=choice;selected=null;hide();
 if(choice==='rest'){S.hp=Math.min(S.maxHp,S.hp+14);S.res=Math.min(S.maxRes,S.res+6)}
 else if(choice==='protect')S.shield=12;
 else if(choice==='study')gainXP(12+floor*2);
 else if(choice==='scroll'){addConsumable('insight');addConsumable('ward')}
 else if(choice==='gold')S.gold=Math.min(GOLD_CAP,goldBalance()+15+floor*2);
 else if(choice==='gear'||choice==='relic')S.bag.push(createGear(++S.serial,floor,3));
 else if(choice==='blood'){S.hp-=8;S.bag.push(createGear(++S.serial,floor,4))}
 else if(choice==='purify'){S.res-=4;S.shield=10}
 else if(choice==='supplies'){S.bandages+=2;addConsumable('heal')}
 else if(choice==='oathHeal'){S.bandages-=2;S.hp=Math.min(S.maxHp,S.hp+24);S.res=Math.min(S.maxRes,S.res+8)}
 else if(choice==='oathWard'){S.gold=goldBalance()-15;S.shield=20}
 else if(choice==='archiveStudy')gainXP(20+floor*2);
 else if(choice==='archiveScroll'){addConsumable('insight');addConsumable('ward')}
 else if(choice==='treasuryGold')S.gold=Math.min(GOLD_CAP,goldBalance()+25+floor*2);
 else if(choice==='treasuryGear')S.bag.push(createGear(++S.serial,floor,4));
 say(SPECIAL_ROOMS[f.roomId].name+' : choix résolu.');finish();return true;
}
function specialRoomMenu(f){
 const r=SPECIAL_ROOMS[f.roomId];if(!r||f.spent)return;
 selected=null;show('<h1>'+r.name+'</h1><p>'+r.desc+'</p><p>Une seule récompense. Le choix coûte un tour : les ennemis peuvent agir.</p>'+r.choices.map(([id,label])=>'<button class="wide" data-room-choice="'+id+'" '+(specialRoomAllowed(f,id)?'':'disabled')+'>'+label+'</button>').join('')+'<button class="wide" id="roomBack">Revenir plus tard</button>');
 panel.querySelectorAll('[data-room-choice]').forEach(b=>b.onclick=()=>resolveSpecialRoom(f,b.dataset.roomChoice));document.getElementById('roomBack').onclick=hide;
}
function drawSpecialRoom(f,px,py,visible){

 else{ctx.fillRect(px+7,py+2,2,5);ctx.fillRect(px+5,py+4,6,2)}
 if(!f.spent&&visible){ctx.fillStyle='#f7e7bc';ctx.fillRect(px+7,py+7,2,2)}
}
/* TECH-012A — Construit un donjon à partir de ses dimensions, de sa profondeur et d'une graine. Le flux pseudo-aléatoire local sépare cette génération des tirages du combat. */
function buildDungeon(W,H,floor,seed){
  // Local deterministic PRNG: combat RNG remains independent.
  let state=seed>>>0;
  const rand=n=>{
    state=(state+0x6D2B79F5)>>>0;
    let t=state;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return Math.floor(((t^(t>>>14))>>>0)/4294967296*n)
  };
  /* TECH-012C — Trois profils définissent le nombre, les dimensions des salles et le nombre de raccourcis recherchés. */
  const profiles=[{id:'chambres',target:11,w:5,h:4,dw:5,dh:4,loops:3},{id:'galeries',target:12,w:4,h:4,dw:8,dh:3,loops:4},{id:'halles',target:8,w:7,h:5,dw:5,dh:5,loops:2}];
  const p=profiles[rand(profiles.length)], map=Array(W*H).fill(1),rooms=[];
  /* TECH-012C — Le creusement conserve une bordure extérieure de murs infranchissables. */
  const index=(x,y)=>y*W+x, carve=(x,y)=>{if(x>0&&y>0&&x<W-1&&y<H-1)map[index(x,y)]=0};
  const add=(x,y,w,h,shape)=>{
    const r={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1),shape};
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){
      if(shape==='chamfer'&&(xx===x||xx===x+w-1)&&(yy===y||yy===y+h-1))continue;
      carve(xx,yy);
    }
    rooms.push(r);
  };
  /* TECH-012C — Le placement est borné à 360 essais ; une marge sépare les salles pour limiter les chevauchements. */
  for(let n=0;n<360&&rooms.length<p.target;n++){
    const w=p.w+rand(p.dw),h=p.h+rand(p.dh),x=1+rand(W-w-1),y=1+rand(H-h-1);
    if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;
    add(x,y,w,h,w>=5&&h>=5&&rand(3)===0?'chamfer':'rect');
  }
  // Finite, connected fallback for the supported 48x32 board.
  if(rooms.length<6){
    map.fill(1);rooms.length=0;
    for(const y of [3,19])for(const x of [3,18,34])add(x,y,8,7,'rect');
  }
  const center=r=>({x:r.cx,y:r.cy}),edges=[];
  for(let a=0;a<rooms.length;a++)for(let b=a+1;b<rooms.length;b++)
    edges.push({a,b,d:Math.abs(rooms[a].cx-rooms[b].cx)+Math.abs(rooms[a].cy-rooms[b].cy),tie:rand(10000)});
  edges.sort((a,b)=>a.d-b.d||a.tie-b.tie);
  /* TECH-012C — Structure union-find : relie les composantes sans cycle lors de la construction de l'arbre couvrant minimal. */
  const parent=rooms.map((_,i)=>i),root=i=>{while(parent[i]!==i){parent[i]=parent[parent[i]];i=parent[i]}return i};
  const tree=[],extra=[];
  const corridor=e=>{
    const a=center(rooms[e.a]),b=center(rooms[e.b]);
    if(rand(2)){for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++)carve(x,a.y);for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++)carve(b.x,y)}
    else{for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++)carve(a.x,y);for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++)carve(x,b.y)}
  };
  /* TECH-012C — L'algorithme de Kruskal sélectionne d'abord les liaisons les plus courtes ; les arêtes restantes servent aux raccourcis. */
  for(const e of edges){
    const a=root(e.a),b=root(e.b);
    if(a===b){
      extra.push(e);
      continue
    }
    parent[a]=b;
    tree.push(e);
    corridor(e)
  }
  let shortcuts=0;
  // Only count added links that actually open at least one new cell.
  for(const e of extra){
    if(shortcuts>=p.loops)break;
    const before=map.reduce((n,v)=>n+(v===0),0);
    corridor(e);
    if(map.reduce((n,v)=>n+(v===0),0)>before)shortcuts++
  }
  /* TECH-012C — Le point de départ est choisi dans une salle feuille de l'arbre. */
  const degree=rooms.map(()=>0);for(const e of tree){degree[e.a]++;degree[e.b]++}
  const leaves=rooms.map((_,i)=>i).filter(i=>degree[i]===1),startRoom=leaves[rand(leaves.length)],start=center(rooms[startRoom]);
  /* TECH-012C — Parcours en largeur orthogonal : mesure la distance réelle dans les couloirs et vérifie la connexité du plan. */
  const distance=Array(W*H).fill(-1),queue=[index(start.x,start.y)];distance[queue[0]]=0;
  for(let i=0;i<queue.length;i++){
    const k=queue[i],x=k%W,y=Math.floor(k/W);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const next=index(nx,ny);if(map[next]===0&&distance[next]<0){distance[next]=distance[k]+1;queue.push(next)}
    }
  }
  if(queue.length!==map.filter(v=>v===0).length)throw new Error('Disconnected dungeon');
  /* TECH-012C — Les escaliers occupent le centre de la salle la plus éloignée du départ selon la distance parcourable. */
  const exitRoom=rooms.reduce((best,r,i)=>distance[index(r.cx,r.cy)]>distance[index(rooms[best].cx,rooms[best].cy)]?i:best,startRoom);
  const stairs=center(rooms[exitRoom]),occupied=new Set([index(start.x,start.y),index(stairs.x,stairs.y)]),monsters=[],loot=[];
  /* TECH-012C — Les ennemis initiaux sont placés à plus de huit cases du départ, en distance de Chebyshev. */
  const safe=(x,y)=>Math.max(Math.abs(x-start.x),Math.abs(y-start.y))>8;
  /* TECH-012C — Choisit une case libre d'une salle et la réserve afin d'éviter les superpositions. */
  const pick=(r,enemy)=>{
    const candidates=[];
    for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++){
      const k=index(x,y);if(map[k]===0&&!occupied.has(k)&&(!enemy||safe(x,y)))candidates.push({x,y});
    }
    if(!candidates.length)return null;
    const pos=candidates[rand(candidates.length)];occupied.add(index(pos.x,pos.y));return pos;
  };
  /* TECH-012C — Détermine le rôle, les PV et l'attaque de base de l'ennemi selon la profondeur et le tirage. */
  const spawn=(pos,elite)=>{
    const roll=rand(100),role=elite?'guardian':roll<24?'brute':roll<49||floor===1?'wanderer':roll<69?'archer':roll<82?'ambusher':floor<3?'wanderer':roll<91?'coward':'tracker';
    const types={guardian:['Gardien','#e6ad65',16+floor*2,5],brute:['Brute','#c87961',8+floor,3],wanderer:['Errant','#bd777d',4+Math.floor(floor/2),2],archer:['Archer','#91ab6e',4+Math.floor(floor/2),2],ambusher:['Guetteur','#9282bb',5+Math.floor(floor/2),2],coward:['Fuyard','#c0b58a',5+Math.floor(floor/2),2],tracker:['Traqueur','#75b0b7',6+Math.floor(floor/2),2]};
    const [kind,color,hp,atk]=types[role];
    monsters.push({...pos,hp,maxHp:hp,atk,kind,elite,color,role});
  };
  if(floor%3===0){
    let pos=pick(rooms[exitRoom],true);
    if(!pos){for(const r of [...rooms].sort((a,b)=>distance[index(b.cx,b.cy)]-distance[index(a.cx,a.cy)])){pos=pick(r,true);if(pos)break}}
    if(pos)spawn(pos,true);
  }
  for(let i=0;i<rooms.length;i++){
    if(i===startRoom)continue;
    const r=rooms[i],count=1+(rand(3)===0?1:0);
    for(let j=0;j<count;j++){if(i===exitRoom&&floor%3===0&&j===0)continue;const pos=pick(r,true);if(pos)spawn(pos,false)}
    if(rand(3)===0){const pos=pick(r,false);if(pos)loot.push({...pos,kind:rand(3)===0?'gear':'bandage'})}
  }
  return {map,start,stairs,monsters,loot,rooms,seed:seed>>>0,profile:p.id,shortcuts};
}
/* TECH-012A — Orchestre la création d'un étage : plan, décoration, secrets, terrain, population et butin. Replace le joueur au départ et initialise les cases découvertes. */
function generate(){
  clearCombatFx();
  const seed=Math.floor(Math.random()*4294967296)>>>0;
  /* TECH-012C — Générer d'abord la géométrie, puis les éléments interactifs et le terrain. */
  const d=buildDungeon(W,H,S.floor,seed);
  const decorated=decorateDungeon(d,W,H,S.floor);
  addDeepSecret(d,decorated,W,H,S.floor);
  map=decorated.map;
  features=decorated.features;
  const biome=biomeForFloor(S.floor,d.seed);
  terrain=buildTerrain(d,decorated,W,H,S.floor,biome);
  seen=Array(W*H).fill(0);
  S.x=d.start.x;
  S.y=d.start.y;
  stairs=d.stairs;
  monsters=selectBossVariant(balanceEnemies(promoteEnemies(d.monsters,S.floor,seed,stairs),S.floor),S.floor,seed);
  loot=addSupplies(d,decorated,terrain);
  for(const l of loot)if(l.kind==='gear')l.item=item();
  loot.push(...placeConsumable(d,decorated,terrain,loot,S.floor));
  const exploration=buildExploration(d,decorated,terrain,loot,monsters,S.floor);
  features.push(...exploration.events);
  if(exploration.rare){
    const rare=exploration.rare;
    monsters=monsters.map(m=>m.x===rare.x&&m.y===rare.y?rare:m)
  }
  monsters=populateBestiary(monsters,biome,S.floor,d.seed);
  const merchant=buildMerchant(d,decorated,terrain,loot,monsters,S.floor,W,H);
  if(merchant)features.push(merchant);
  for(const room of buildSpecialRooms(d,decorated,terrain,loot,monsters,S.floor,W,H)){
    if(room.secret){
      const i=features.findIndex(f=>f.type==='chest'&&f.secret&&f.x===room.x&&f.y===room.y);
      if(i>=0)features.splice(i,1,room)
    }else features.push(room)
  }
  /* TECH-012C — Les utilisations de soins sont réinitialisées à chaque étage ; la graine est conservée dans l'état. */
  S.healUses=0;
  S.dungeon={version:1,seed:d.seed,profile:d.profile,biome};
  reveal()
}
/* TECH-012C — Copie la grille de base et ajoute les éléments interactifs en évitant les positions réservées. La graine dérivée garde les tirages séparés de la génération initiale. */
function decorateDungeon(d,W,H,floor){
  let s=(d.seed^0x43ac91d7)>>>0;
  const rnd=n=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return Math.floor(s/4294967296*n)};
  const map=d.map.slice(),features=[],key=(x,y)=>y*W+x,inside=(x,y)=>x>0&&y>0&&x<W-1&&y<H-1;
  const open=(x,y)=>inside(x,y)&&map[key(x,y)]===0,occupied=new Set([d.start,d.stairs,...d.monsters,...d.loot].map(p=>key(p.x,p.y)));
  const far=(x,y)=>Math.max(Math.abs(x-d.start.x),Math.abs(y-d.start.y))>4;
  const add=(x,y,type,extra={})=>{features.push({x,y,type,...extra});occupied.add(key(x,y))};
  const candidates=pred=>{
    const a=[];
    for(let y=1;y<H-1;y++)
      for(let x=1;x<W-1;x++)
        if(!occupied.has(key(x,y))&&far(x,y)&&pred(x,y))a.push({x,y});
    return a
  };
  const select=(a,count,fn)=>{for(let i=0;i<count&&a.length;i++){const p=a.splice(rnd(a.length),1)[0];if(!occupied.has(key(p.x,p.y)))fn(p.x,p.y)}};
  /* TECH-012C — Une porte est placée dans un passage étroit : ouvert sur un axe, fermé sur l'autre. */
  const doors=candidates((x,y)=>open(x,y)&&((open(x-1,y)&&open(x+1,y)&&!open(x,y-1)&&!open(x,y+1))||(open(x,y-1)&&open(x,y+1)&&!open(x-1,y)&&!open(x+1,y))));
  select(doors,Math.min(5,2+Math.floor(floor/3)),(x,y)=>add(x,y,'door',{open:false,found:true}));
  select(candidates((x,y)=>open(x,y)&&d.rooms.some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h)),2+(floor>=5?1:0),(x,y)=>add(x,y,'chest',{open:false,found:true,reward:rnd(4)===0?'bandage':'gear'}));
  if(floor>=2)select(candidates((x,y)=>open(x,y)),Math.min(5,1+Math.floor(floor/3)),(x,y)=>add(x,y,'trap',{found:false,spent:false,damage:3+Math.min(5,Math.floor(floor/3))}));
  /* TECH-012C — Recherche une zone murée de 3 × 3 entourée de murs, avec une entrée adjacente à un passage existant. */
  const secrets=[];
  for(let y=2;y<H-4;y++)for(let x=2;x<W-4;x++)for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const ex=x+1-dx*2,ey=y+1-dy*2,ax=ex-dx,ay=ey-dy;
    if(!open(ax,ay)||occupied.has(key(ax,ay))||!far(ex,ey)||occupied.has(key(ex,ey)))continue;
    let valid=true;
    for(let yy=y-1;yy<=y+3;yy++)for(let xx=x-1;xx<=x+3;xx++)if(!inside(xx,yy)||map[key(xx,yy)]!==1)valid=false;
    if(valid)secrets.push({x,y,ex,ey});
  }
  if(secrets.length){
    const q=secrets[rnd(secrets.length)];
    for(let y=q.y;y<q.y+3;y++)for(let x=q.x;x<q.x+3;x++)map[key(x,y)]=0;
    add(q.ex,q.ey,'secret',{open:false,found:false});
    add(q.x+1,q.y+1,'chest',{open:false,found:true,reward:'gear',secret:true});
  }
  /* TECH-012C — Les portes fermées deviennent des obstacles dans la grille ; leur ouverture rétablit la case libre. */
  for(const f of features)if(f.type==='door')map[key(f.x,f.y)]=1;
  return {map,features};
}
function featureAt(x,y){return features.find(f=>f.x===x&&f.y===y)}
function searchNearby(){
  let found=0,disarmed=0;
  for(const f of features){
    if(Math.abs(f.x-S.x)+Math.abs(f.y-S.y)>1)continue;
    if((f.type==='secret'||f.type==='trap')&&!f.found&&!f.spent){f.found=true;found++;say(f.type==='secret'?'Passage secret découvert.':'Piège repéré.')}
    else if(f.type==='trap'&&f.found&&!f.spent){f.spent=true;disarmed++;say('Piège désamorcé.')}
  }
  if(!found&&!disarmed)say('Tu attends et fouilles les environs.');
}
/* TECH-012C — Traite les interactions avec les éléments du donjon, notamment portes, passages secrets et coffres ; une porte ouverte devient praticable dans map. */
function interactFeature(f){
  if(!f)return false;
  if((f.type==='door'||f.type==='secret')&&!f.open&&(f.type!=='secret'||f.found)){
    f.open=true;map[idx(f.x,f.y)]=0;say(f.type==='secret'?'Passage secret ouvert.':'Porte ouverte.');return true;
  }
  if(f.type==='chest'&&!f.open){
    if(f.reward==='gear'&&S.bag.length>=24){say('Sac plein : coffre laissé fermé.');return true}
    f.open=true;if(f.reward==='bandage'){S.bandages+=2;say('Coffre : 2 bandages.')}else{const it=item();S.bag.push(it);say('Coffre : '+it.name);}
    return true;
  }
  return false;
}
/* TECH-012C — Révèle et désactive définitivement le piège déclenché, retire les PV et lance la fin de partie si les dégâts sont mortels. */
function triggerTrap(x,y){
  const f=featureAt(x,y);if(!f||f.type!=='trap'||f.spent)return;
  f.found=true;f.spent=true;S.hp=Math.max(0,S.hp-f.damage);say('Piège déclenché : -'+f.damage+' PV.');if(S.hp===0)die();
}

const OBJECT_ART_CACHE=new Map(),OBJECT_CACHE_LIMIT=256;
/* TECH-012C — Produit les rectangles d'un objet selon son type, sa couleur et son état ; les variantes sont mises en cache. */
function objectSprite(id,color,visible=true,spent=false){
 id=Object.hasOwn(OBJECT_ART,id)?id:'gear';
 color=/^#[0-9a-f]{6}$/i.test(color||'')?color:'#a6b8ba';
 const key=[id,color,visible,spent].join(':');if(OBJECT_ART_CACHE.has(key))return OBJECT_ART_CACHE.get(key);
 const base=spent?tileTint('#858990',.72):color;
 const tint=visible?1:.48;
 const palette={o:tileTint('#22202a',tint),H:tileTint(base,tint),h:tileTint(base,1.3*tint),e:tileTint(spent?'#858990':'#ffe7ae',tint)};
 const ops=[];OBJECT_ART[id].forEach((row,y)=>{for(let x=0;x<row.length;){const v=row[x];let end=x+1;while(end<row.length&&row[end]===v)end++;if(v!=='.')ops.push([palette[v],x+3,y+3,end-x,1]);x=end}});
 /* TECH-012C — Évite la croissance illimitée du cache en retirant la première entrée lorsque la limite est atteinte. */
 if(OBJECT_ART_CACHE.size>=OBJECT_CACHE_LIMIT)OBJECT_ART_CACHE.delete(OBJECT_ART_CACHE.keys().next().value);
 OBJECT_ART_CACHE.set(key,ops);return ops;
}
/* TECH-012C — Associe le butin à une silhouette et une couleur de rareté ou de catégorie. */
function lootArt(l){
 if(l.kind==='bandage')return ['bandage','#d5c7a4'];
 if(l.kind==='consumable'){const v=CONSUMABLES[l.consumable];return [v?.type==='Potion'?'potion':v?.type==='Parchemin'?'scroll':l.consumable==='smoke'?'smoke':l.consumable==='toolkit'?'toolkit':'gear',v?.color||'#a6b8ba']}
 const it=l.item;if(!it)return ['gear','#85b8d5'];
 return [it.slot==='weapon'?weaponFamily(it)||'blade':Object.hasOwn(OBJECT_ART,it.slot)?it.slot:'gear',RARITIES[rarityOf(it)-1].color];
}
/* TECH-012C — Retourne le dessin approprié à un élément découvert, y compris ses états ouvert ou utilisé. */
function featureArt(f){
 if(!f||!f.found)return null;
 if(f.type==='door'||f.type==='secret')return [f.open?'doorOpen':f.type,'#a58150',false];
 if(f.type==='chest')return [f.open?'chestOpen':'chest','#c18b47',false];
 if(f.type==='trap')return [f.spent?'trapSpent':'trap','#cf7965',!!f.spent];
 if(f.type==='merchant')return [f.merchantId,MERCHANTS[f.merchantId]?.color||'#bba67c',false];
 if(f.type==='event')return [f.eventId,EXPLORATION_EVENTS[f.eventId]?.color||'#b6a0d9',!!f.spent];
 if(f.type==='specialRoom')return [f.roomId,SPECIAL_ROOMS[f.roomId]?.color||'#d2c5a1',!!f.spent];

    }
  }

}
/* TECH-012C — Gère les attaques spéciales des boss historiques : annonce, résolution, recharge et changement de phase à mi-vie. */
function bossAction(m,player,board){
  if(!m.boss)return null;
  const d=(a,b)=>Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y)),same=(a,b)=>a.x===b.x&&a.y===b.y;
  const ray=(a,b)=>{let n=d(a,b),prev=a;if(!n)return true;for(let i=1;i<=n;i++){const p={x:Math.round(a.x+(b.x-a.x)*i/n),y:Math.round(a.y+(b.y-a.y)*i/n)};if(!board.stepOK(p.x,p.y,prev.x,prev.y))return false;prev=p}return true};
  const changed=m.phase!==2&&m.hp*2<=m.maxHp;
  if(changed)m.phase=2;
  /* TECH-012C — La résolution utilise les cases annoncées au tour précédent, et vérifie encore la ligne d'attaque. */
  if(m.intent){
    const intent=m.intent;
    delete m.intent;
    m.specialCD=m.phase===2?2:3;
    return {type:'release',hit:intent.cells.some(p=>same(p,player))&&ray(m,player),power:intent.power,changed};
  }
  if(m.specialCD>0){m.specialCD--;return changed?{type:'phase'}:null}
  const range=m.boss==='stone'?2:m.boss==='ash'?3:4;
  if(d(m,player)>range||!ray(m,player))return changed?{type:'phase'}:null;
  const cells=[{x:player.x,y:player.y}];
  if(m.boss==='ash'||m.phase===2&&m.boss==='stone')for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const p={x:player.x+dx,y:player.y+dy};if(board.stepOK(p.x,p.y,player.x,player.y)&&ray(m,p)&&!same(m,p))cells.push(p)
  }
  m.intent={cells,power:m.phase===2?3:2};
  return {type:'announce',changed};
}
function bossReward(m){

  return {id:++S.serial,slot,name:({stone:'Cuirasse de Kharok',ash:'Lame de Syrha',veil:'Anneau de Veyl'})[m.boss],atk:slot==='weapon'?4:slot==='ring'?2:0,def:slot==='armor'?4:0,crit:slot==='ring'?6:0,regen:slot==='ring'?1:0,bossRelic:true,rarity:5,itemLevel:Math.max(1,Math.min(30,S.floor)),uniqueId:'boss-'+m.boss,...(slot==='weapon'?{family:'blade'}:{})};
}
function eliteReward(){return item(2)}
/* TECH-012C — Retire un ennemi vaincu, attribue or et expérience, puis distribue le butin selon son type et les tirages aléatoires. */
function kill(m){
  if(!monsters.includes(m))return;
  monsters=monsters.filter(x=>x!==m);
  S.gold=Math.min(GOLD_CAP,goldBalance()+goldReward(m,S.floor));
  S.kills++;

  if(m.boss)
    loot.unshift({x:m.x,y:m.y,kind:'gear',item:Object.hasOwn(EXTENDED_BOSSES,m.boss)?extendedBossReward(m):bossReward(m)});
  else if(m.rare){
    loot.push({x:m.x,y:m.y,kind:'gear',item:createGear(++S.serial,S.floor,4)},
              {x:m.x,y:m.y,kind:'consumable',consumable:rollConsumable(S.floor)})
  }else if(m.affix)
    loot.push({x:m.x,y:m.y,kind:'gear',item:eliteReward()});

  }
  if(!m.boss&&!m.affix&&rand(12)===0)
    loot.push({x:m.x,y:m.y,kind:'consumable',consumable:rollConsumable(S.floor)});
