name: Android APK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ART_PREVIEW: ${{ github.head_ref == 'release/game-009f-art-rc' || github.ref == 'refs/heads/release/game-009f-art-rc' }}
      GAME_PREVIEW: ${{ github.head_ref == 'feature/game-010e-balance-rc1' || github.ref == 'refs/heads/feature/game-010e-balance-rc1' || github.head_ref == 'release/game-010-rc1' || github.ref == 'refs/heads/release/game-010-rc1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Compile APK and instrumentation tests
        run: |
          args=()
          if [ "$ART_PREVIEW" = true ]; then args+=(-PcryptgraveArtPreview); elif [ "$GAME_PREVIEW" = true ]; then args+=(-PcryptgraveGamePreview); fi
          gradle -p android --no-daemon "${args[@]}" :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APK payload and original engine
        run: |
          python - <<'PY'
          import zipfile, pathlib, hashlib
          apk=pathlib.Path('android/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              html=z.read('assets/index.html').decode('utf-8')
          original=pathlib.Path('index.html').read_text()
          assert html.split('<script>')[1].split('</script>')[0] == original.split('<script>')[1].split('</script>')[0]
          assert 'CRYPTGRAVE' in html
          assert 'navigator.serviceWorker.register' not in html
          print('Engine preserved:', hashlib.sha256(html.split('<script>')[1].split('</script>')[0].encode()).hexdigest())
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-permissions.txt
          ! grep -F 'android.permission.INTERNET' /tmp/apk-permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-badging.txt
          if [ "$ART_PREVIEW" = true ]; then
            grep -F "package: name='com.mathiks.cryptgrave.artpreview' versionCode='2' versionName='0.9.1-art-rc1'" /tmp/apk-badging.txt
          elif [ "$GAME_PREVIEW" = true ]; then
            grep -F "package: name='com.mathiks.cryptgrave.gamepreview' versionCode='3' versionName='0.10.0-rc1'" /tmp/apk-badging.txt
          else
            expected=$(node -e 'const m=require("./release.json");process.stdout.write("package: name=\x27"+m.applicationId+(m.stage==="rc"?m.previewSuffix:"")+"\x27 versionCode=\x27"+m.versionCode+"\x27 versionName=\x27"+m.version+"\x27")')
            grep -F "$expected" /tmp/apk-badging.txt
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            if [ "$ART_PREVIEW" = true ]; then gradle -p android --no-daemon -PcryptgraveArtPreview :app:connectedDebugAndroidTest; elif [ "$GAME_PREVIEW" = true ]; then gradle -p android --no-daemon -PcryptgraveGamePreview :app:connectedDebugAndroidTest; else gradle -p android --no-daemon :app:connectedDebugAndroidTest; fi
      - name: Prepare test APK
        run: |
          mkdir -p apk-preview
          if [ "$ART_PREVIEW" = true ]; then
            name=CRYPTGRAVE-0.9.1-art-rc1.apk
            cp docs/GAME009F_ART_RC.md apk-preview/RECETTE.md
          elif [ "$GAME_PREVIEW" = true ]; then
            name=CRYPTGRAVE-0.10.0-rc1-preview.apk
            cp docs/GAME010E_RC1.md apk-preview/RECETTE.md
          else
            version=$(node -p 'require("./release.json").version')
            name="CRYPTGRAVE-${version}-test.apk"
            cp docs/GAME011D_RELEASE_PACKAGING.md apk-preview/RECETTE.md
            cp release.json apk-preview/RELEASE.json
            echo "V1_ARTIFACT=cryptgrave-${version}-android" >> "$GITHUB_ENV"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk-preview/$name"
          git rev-parse HEAD > apk-preview/BUILD_SHA.txt
          cp /tmp/apk-badging.txt apk-preview/APK_INFO.txt
          cd apk-preview
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ART_PREVIEW == 'true' && 'cryptgrave-art-rc1-android' || env.GAME_PREVIEW == 'true' && 'cryptgrave-010-rc1-android' || env.V1_ARTIFACT || 'cryptgrave-android-test' }}
          path: apk-preview/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cryptgrave-android-test-report
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
