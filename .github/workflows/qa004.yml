name: QA-004
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all engine suites
        run: |
          git show 087621fea8d6bba80aa5e1efc4c589fda09ec418:index.html > /tmp/rogue-003b.html
          for test in tests/game004*.cjs tests/qa004.cjs tests/game005a.cjs tests/game005b.cjs tests/game005c.cjs; do
            echo "Running $test"
            node "$test" /tmp/rogue-003b.html || exit 1
          done
  chromium-mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/qa004-browser.cjs
