name: QA-004
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Publish validated main build to GitHub Pages'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all engine suites
        run: |
          git show 087621fea8d6bba80aa5e1efc4c589fda09ec418:index.html > /tmp/rogue-003b.html
          for test in tests/game004*.cjs tests/qa004.cjs tests/game005a.cjs tests/game005b.cjs tests/game005c.cjs tests/game005d.cjs tests/game005e.cjs tests/game005f.cjs tests/game006a.cjs tests/game006b.cjs tests/game006c.cjs tests/game006d.cjs tests/game006e.cjs tests/game006f.cjs tests/game007a.cjs tests/game007b.cjs tests/game007c.cjs tests/game007d.cjs tests/game007e.cjs tests/game007f.cjs; do
            echo "Running $test"
            node "$test" /tmp/rogue-003b.html || exit 1
          done
      - name: Verify migration from released GAME-004 and RC1
        run: |
          git show 2918d5ba49c37440f01c26fc5cd41bc4d0938eba:index.html > /tmp/rogue-game004.html
          git show 3344817bc9e6d4c7d7ea8acf3c7af118fe2c0e60:index.html > /tmp/rogue-rc1.html
          node tests/game008a.cjs /tmp/rogue-game004.html /tmp/rogue-rc1.html
      - name: Verify portable saves from validated Android 0.9.0
        run: |
          git show e8f7796d2a30aec0901d90a02f2b46ae630220ba:index.html > /tmp/cryptgrave-090.html
          node tests/game008e3.cjs /tmp/cryptgrave-090.html
      - name: Verify illustrated class cards
        run: node tests/game009b.cjs
      - name: Verify character dossier
        run: node tests/game009c.cjs
      - name: Verify equipment and bag presentation
        run: node tests/game009d.cjs
      - name: Verify dungeon HUD and journal
        run: node tests/game009e.cjs
      - name: Verify class specialization doctrines
        run: node tests/game010a.cjs
      - name: Verify talent synergies
        run: node tests/game010b.cjs
      - name: Verify tactical coordination and boss patterns
        run: node tests/game010c.cjs
  chromium-mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/qa004-browser.cjs
        env:
          ROGUE_ART_PREVIEW: '1'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rogue-interface-art-preview
          path: art-preview/
          if-no-files-found: error
          retention-days: 30

  rc1-package:
    if: github.head_ref == 'release/game-006-rc1' || github.ref == 'refs/heads/release/game-006-rc1'
    needs: [engine, chromium-mobile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone browser candidate
        run: |
          mkdir -p candidate
          cp index.html candidate/index.html
          cp docs/GAME006_RC1_RECIPE.md candidate/RECETTE.md
          git rev-parse HEAD > candidate/BUILD_SHA.txt
          sha256sum candidate/index.html > candidate/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rogue-game-006-rc1
          path: candidate/
          retention-days: 30
          if-no-files-found: error

  rc2-package:
    if: github.head_ref == 'release/game-007-rc2' || github.ref == 'refs/heads/release/game-007-rc2'
    needs: [engine, chromium-mobile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rogue-interface-art-preview
          path: candidate/captures
      - name: Prepare standalone Android browser candidate
        run: |
          mkdir -p candidate
          cp index.html candidate/index.html
          cp docs/GAME007_RC2_RECIPE.md candidate/RECETTE.md
          cp docs/GAME006_RC1_RECIPE.md candidate/RECETTE_RC1.md
          git rev-parse HEAD > candidate/BUILD_SHA.txt
          cd candidate
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rogue-game-007-rc2
          path: candidate/
          retention-days: 30
          if-no-files-found: error

  pwa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/game008c-pwa.cjs
      - run: node tools/build-pwa.cjs pwa-dist
      - uses: actions/upload-artifact@v4
        with:
          name: rogue-pwa-preview
          path: pwa-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      # Upload during the build job, not immediately before deployment.
      - name: Package tested PWA for Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_pages == true
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: pwa-dist
          retention-days: 7

  pages-deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_pages == true
    needs: [engine, chromium-mobile, pwa]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    concurrency:
      group: rogue-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Wait for the single Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name=github-pages --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [ "$count" = 1 ]; then
                echo "Pages artifact is visible."
                exit 0
              elif [ "$count" -gt 1 ]; then
                echo "::error::Multiple github-pages artifacts. Start a new workflow run instead of re-uploading."
                exit 1
              fi
            fi
            echo "Artifact metadata not visible yet (attempt $attempt/12)."
            sleep 5
          done
          echo "::error::Pages artifact is still unavailable. Retry only pages-deploy, or start a fresh run."
          exit 1
      - name: Deploy tested PWA
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
