name: Android release candidate
on:
  pull_request:
    paths:
      - 'android/**'
      - 'index.html'
      - 'icon.svg'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      sign_candidate:
        description: 'Sign RC with configured production key (no publication)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unsigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build unsigned candidate
        run: gradle -p android --no-daemon -PcryptgraveReleaseCandidate :app:assembleRelease
      - name: Validate candidate contents
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/rc-badging.txt
          grep -F "package: name='com.mathiks.cryptgrave' versionCode='2' versionName='1.0.0-rc1'" /tmp/rc-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/rc-permissions.txt
          ! grep -F 'android.permission.INTERNET' /tmp/rc-permissions.txt
          python - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('android/app/build/outputs/apk/release/app-release-unsigned.apk') as z:
              embedded=z.read('assets/index.html').decode('utf-8')
          source=pathlib.Path('index.html').read_text()
          assert embedded.split('<script>')[1].split('</script>')[0] == source.split('<script>')[1].split('</script>')[0]
          assert 'CRYPTGRAVE' in embedded
          assert 'navigator.serviceWorker.register' not in embedded
          PY
          mkdir -p unsigned-rc
          cp "$APK" unsigned-rc/CRYPTGRAVE-1.0.0-rc1-unsigned.apk
          git rev-parse HEAD > unsigned-rc/BUILD_SHA.txt
          cd unsigned-rc
          sha256sum CRYPTGRAVE-1.0.0-rc1-unsigned.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cryptgrave-rc1-unsigned-NOT-INSTALLABLE
          path: unsigned-rc/
          if-no-files-found: error
          retention-days: 14
  sign:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_candidate == true
    needs: unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-production
    concurrency:
      group: cryptgrave-production-signing
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cryptgrave-rc1-unsigned-NOT-INSTALLABLE
          path: unsigned-rc
      - name: SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Sign and verify exact candidate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD CERT_SHA256; do
            if [ -z "${!name}" ]; then echo "Missing protected signing configuration: $name"; exit 1; fi
          done
          umask 077
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$temp/key.jks"
          unset KEYSTORE_B64
          (cd unsigned-rc && sha256sum -c SHA256SUMS.txt)
          test "$(cat unsigned-rc/BUILD_SHA.txt)" = "$GITHUB_SHA"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f -P 16 4 unsigned-rc/CRYPTGRAVE-1.0.0-rc1-unsigned.apk "$temp/aligned.apk"
          mkdir -p signed-rc
          apk=signed-rc/CRYPTGRAVE-1.0.0-rc1.apk
          "$tools/apksigner" sign --ks "$temp/key.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$temp/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$temp/verify.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$temp/verify.txt" | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "$expected"
          "$tools/zipalign" -c -P 16 4 "$apk"
          printf '%s\n' "$actual" > signed-rc/CERT_SHA256.txt
          cp unsigned-rc/BUILD_SHA.txt signed-rc/
          cd signed-rc
          sha256sum CRYPTGRAVE-1.0.0-rc1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cryptgrave-1.0.0-rc1-signed-candidate
          path: signed-rc/
          if-no-files-found: error
          retention-days: 30
